<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Helmet Heroes — Редактор карт (реальная графика)</title>
<style>
:root {
  --bg:#0b0f17; --panel:#111827; --panel2:#151e2d; --panel3:#1b2536;
  --line:#243044; --line2:#2c3a52;
  --fg:#dbe3f0; --dim:#8b98ad; --acc:#3b82f6; --acc2:#22d3ee;
  --danger:#7f2d3b; --danger2:#a03b4d; --canvas:#070a10;
}
* { box-sizing:border-box; }
body { margin:0; height:100vh; display:flex; flex-direction:column; font:14px/1.45 "Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--fg); }
header { display:flex; gap:8px; align-items:center; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; flex:0 0 auto; }
header h1 { font-size:16px; margin:0; letter-spacing:.02em; }
.tabs { display:flex; gap:4px; }
.tabs button { padding:7px 14px; border:1px solid var(--line); background:var(--panel2); color:var(--fg); border-radius:6px; cursor:pointer; }
.tabs button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
main { display:flex; flex:1; min-height:0; }
.panel { padding:12px; overflow:auto; background:var(--panel); }
#tools { width:var(--tools-w,300px); min-width:180px; max-width:720px; border-right:1px solid var(--line); background:var(--panel); }
#right { width:var(--right-w,320px); min-width:220px; max-width:640px; border-left:1px solid var(--line); background:var(--panel); }
#stage { flex:1; min-width:0; padding:0; position:relative; overflow:hidden; background:var(--bg); }
#split { width:6px; cursor:col-resize; background:var(--panel2); flex:0 0 6px; }
#split2 { width:6px; cursor:col-resize; background:var(--panel2); flex:0 0 6px; }
#split:hover, #split2:hover { background:var(--acc); }
h2 { font-size:12px; margin:14px 0 6px; color:var(--acc2); text-transform:uppercase; letter-spacing:.06em; }
label { display:block; margin:6px 0 2px; color:var(--dim); font-size:12px; }
input,select,button { font:inherit; }
input[type=text],input[type=number],select { width:100%; padding:6px 8px; background:var(--panel2); border:1px solid var(--line); color:var(--fg); border-radius:5px; }
input[type=text]:focus,input[type=number]:focus,select:focus { outline:none; border-color:var(--acc); box-shadow:0 0 0 2px rgba(59,130,246,.18); }
button { padding:7px 10px; border:1px solid var(--line); background:var(--panel3); color:var(--fg); border-radius:5px; cursor:pointer; }
button:hover { background:var(--line2); border-color:var(--acc); }
button.primary { background:var(--acc); border-color:var(--acc); color:#fff; }
button.danger { background:var(--danger); border-color:var(--danger2); }
.row { display:flex; gap:6px; align-items:center; margin-top:6px; }
.row input,.row select { flex:1; }
canvas { border:1px solid var(--line); background:var(--canvas); cursor:crosshair; }
.gridmeta { color:var(--dim); font-size:12px; margin:6px 0; }
.palwrap { max-height:340px; overflow:auto; border:1px solid var(--line); border-radius:6px; padding:6px; background:var(--panel2); }
.palgrid { display:flex; flex-wrap:wrap; gap:3px; }
.tilepick { width:36px; height:36px; border:1px solid var(--line2); border-radius:4px; cursor:pointer;
  image-rendering:pixelated; background-repeat:no-repeat; overflow:hidden; }
.tilepick:hover { border-color:var(--acc2); }
.tilepick.on { outline:2px solid var(--acc); outline-offset:-1px; }
.tileid { font-size:9px; color:#fff; text-shadow:1px 1px 2px #000; }
.portal-row,.spawn-row { display:flex; gap:4px; align-items:center; margin:4px 0; }
.portal-row input,.spawn-row input { padding:4px; font-size:12px; min-width:0; flex:1; }
.portal-row input { flex:0 0 40px; }
.portal-row input[placeholder="арена"] { flex:1 1 64px; }
.portal-row button, .spawn-row button { flex:0 0 auto; padding:4px 6px; }
.tag { font-size:11px; color:var(--acc2); }
.swfbar { margin-top:6px; padding:7px 8px; border:1px solid var(--line); border-radius:6px; background:var(--panel2); }
.swfbar-top { display:flex; justify-content:space-between; gap:8px; font-size:11px; color:var(--dim); }
.swfbar-top b { color:var(--acc2); font-weight:600; }
.swfbar-track { height:9px; margin:6px 0 4px; border-radius:5px; background:var(--panel3); overflow:hidden; }
.swfbar-fill { height:100%; width:0%; border-radius:5px; background:linear-gradient(90deg,var(--acc),var(--acc2)); transition:width .3s ease; }
.swfbar-fill.ok { background:linear-gradient(90deg,#1f7a4d,#22c55e); }
.swfbar-fill.err { background:linear-gradient(90deg,#7f2d3b,#a03b4d); }
.swfbar-note { font-size:11px; color:var(--dim); white-space:pre-wrap; word-break:break-word; }
.btnrow { display:flex; gap:4px; flex-wrap:wrap; margin-top:4px; }
.btnrow button { flex:1 1 auto; padding:6px 8px; }
.btnrow button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
canvas.nogrid { background:var(--canvas); }
.chk { display:flex; align-items:center; gap:6px; margin-top:6px; font-size:12px; color:var(--dim); }
/* ---- раскладка (toolbar + вьюпорт + правая панель) ---- */
.topbar { display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
.topbar .sep { width:1px; height:22px; background:var(--line); margin:0 4px; }
.toolbtn { min-width:32px; padding:6px 8px; font-size:15px; line-height:1; }
.toolbtn.on { background:var(--acc); border-color:var(--acc); color:#fff; }
#viewwrap { position:absolute; inset:0; overflow:hidden; }
#map { display:block; cursor:crosshair; background:var(--canvas); }
.hud { position:absolute; left:8px; bottom:8px; background:rgba(11,15,23,.86); border:1px solid var(--line);
  border-radius:6px; padding:4px 8px; font-size:12px; color:var(--fg); pointer-events:none; white-space:nowrap; }
.hud b { color:#fff; }
#minimap { border:1px solid var(--line); border-radius:6px; background:var(--canvas); display:block; width:100%; cursor:pointer; }
.layrow { display:flex; align-items:center; gap:6px; padding:4px 6px; border:1px solid var(--line);
  border-radius:5px; margin:3px 0; background:var(--panel2); cursor:pointer; }
.layrow:hover { border-color:var(--line2); }
.layrow.on { border-color:var(--acc); background:#16233a; }
.layrow .lname { flex:1; font-size:12px; }
.layrow .lbtn { padding:2px 6px; font-size:12px; }
.layrow.locked { opacity:.6; }
.proprow { display:flex; gap:6px; align-items:center; margin:4px 0; }
.proprow > label { flex:0 0 96px; margin:0; }
.proprow > input, .proprow > select { flex:1; }
.vbox { font-size:12px; }
.vitem { display:flex; gap:6px; padding:4px 6px; border-radius:5px; margin:3px 0; background:var(--panel2); }
.vitem.err  { border-left:3px solid #ef4444; }
.vitem.warn { border-left:3px solid #eab308; }
.vitem.info { border-left:3px solid var(--acc2); }
.chips { display:flex; flex-wrap:wrap; gap:4px; margin:4px 0; }
.chip { padding:2px 8px; font-size:11px; border:1px solid var(--line); border-radius:10px; cursor:pointer; background:var(--panel2); }
.chip.on { background:var(--acc); border-color:var(--acc); color:#fff; }
.palitem { position:relative; width:36px; height:36px; border:1px solid var(--line2); border-radius:4px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; image-rendering:pixelated; background-repeat:no-repeat; }
.palitem:hover { border-color:var(--acc2); }
.palitem.on { outline:2px solid var(--acc); }
.palitem span { position:absolute; top:0; right:2px; font-size:10px; color:#fff; text-shadow:1px 1px 2px #000; }
.palhover { position:fixed; display:none; z-index:60; border:1px solid var(--line2); background:var(--panel3);
  border-radius:8px; padding:6px; pointer-events:none; box-shadow:0 10px 30px rgba(0,0,0,.55); }
.palhover img { image-rendering:pixelated; }
.tabpanel { padding:14px; overflow:auto; height:100%; }
.tabpanel h2:first-child { margin-top:0; }
/* ---- Midnight: скроллбары и мелочи ---- */
* { scrollbar-color:#2c3a52 var(--panel2); scrollbar-width:thin; }
::-webkit-scrollbar { width:10px; height:10px; }
::-webkit-scrollbar-track { background:var(--panel2); }
::-webkit-scrollbar-thumb { background:#2c3a52; border-radius:6px; border:2px solid var(--panel2); }
::-webkit-scrollbar-thumb:hover { background:var(--acc); }
input[type=range] { accent-color:var(--acc); }
input[type=checkbox] { accent-color:var(--acc); }
</style>
</head>
<body>
<header>
  <h1>HH Редактор</h1>
  <div class="tabs">
    <button id="tabMap" class="on" onclick="showTab('map')">Карта</button>
    <button id="tabObj" onclick="showTab('objects')">Настройка</button>
    <button id="tabEquip" onclick="showTab('equip')">Экипировка</button>
  </div>
  <div class="topbar" id="topbar"></div>
  <span class="tag" id="status" style="margin-left:auto"></span>
</header>
<main>
  <aside id="tools" class="panel"></aside>
  <div id="split" title="потяни, чтобы изменить ширину панели"></div>
  <section id="stage" class="panel"></section>
  <div id="split2" title="потяни, чтобы изменить ширину правой панели"></div>
  <aside id="right" class="panel"></aside>
</main>
<script>
// ===================== state =====================
let W = 40, H = 25;                          // размер карты — свой у каждой (переменный)
const NO = 255, TSZ = 165;                   // TSZ = размер тайла в игре (px)
// [ключ, название для человека, имя слоя в JSON]
const LAYERS = [
  ['main','Земля 1 — по ней ходишь','mapMain'],
  ['g2','Земля 2 — платформа (спуститься/подняться)','mapG2'],
  ['g3','Земля 3 — фон','mapG3'],
  ['water','Вода','mapWater'],
  ['art','Декор фона','mapArt'],
  ['fg','Передний план','mapFG']
];
// Клиент: main = «solid» (твёрдая, спрыгнуть нельзя), g2/g3 = «platform» (односторонние — можно
// спрыгнуть вниз, присев + ВНИЗ: GravityObject.dropThroughCheck). Склоны (9/10/21/22/33/54/55/67)
// кладутся в «Землю 1» — наклон клиент считает только по main (TileHandler.tileSlope).
const targetLayer = () => layer;
// Порядок отрисовки в КЛИЕНТЕ (снизу вверх). В GameMain.tileDataGot массивы рисуются в порядке
// art -> main -> water -> g2 -> g3 -> fg, а каждый тайл, кроме переднего плана, добавляется
// через addChildAt(image, 0) — поэтому итог: Земля 3 (g3) САМЫЙ НИЖНИЙ слой, выше неё g2, вода,
// Земля 1, затем декор фона (art) и поверх всего передний план (fg).
const LAYER_DRAW_ORDER = ['g3','g2','water','main','art','fg'];
const LAYER_BY_KEY = {}; LAYERS.forEach(l => LAYER_BY_KEY[l[0]] = l);
let area = { name:'map_1',
  layers:{ main:Array(W*H).fill(NO), water:Array(W*H).fill(NO), g2:Array(W*H).fill(NO),
    g3:Array(W*H).fill(NO), fg:Array(W*H).fill(NO), art:Array(W*H).fill(NO) },
  sizes:{ main:Array(W*H).fill(0), water:Array(W*H).fill(0), g2:Array(W*H).fill(0),
    g3:Array(W*H).fill(0), fg:Array(W*H).fill(0), art:Array(W*H).fill(0) },
  // трансформация тайла: бит0 = зеркало по H, бит1 = зеркало по V, биты2-3 = поворот (0..3)*90
  flag:{ main:Array(W*H).fill(0), water:Array(W*H).fill(0), g2:Array(W*H).fill(0),
    g3:Array(W*H).fill(0), fg:Array(W*H).fill(0), art:Array(W*H).fill(0) },
  // ручное смещение тайла в пикселях игры (клетка = 165 px)
  ox:{ main:Array(W*H).fill(0), water:Array(W*H).fill(0), g2:Array(W*H).fill(0),
    g3:Array(W*H).fill(0), fg:Array(W*H).fill(0), art:Array(W*H).fill(0) },
  oy:{ main:Array(W*H).fill(0), water:Array(W*H).fill(0), g2:Array(W*H).fill(0),
    g3:Array(W*H).fill(0), fg:Array(W*H).fill(0), art:Array(W*H).fill(0) },
  portals:[], spawns:[], atms:[], playerSpawn:null, background:'',
  npcs:[] };   // продавцы карты: [x, y, "имя из data/npcs.json", "переопределение товаров (пусто = из каталога)"]
let layer='main', tile=40, tool='paint', currentTab='map';

// ===================== семантика тайлов клиента (TileHandler.createTile / tileSlope) =====================
// Зеркало в игре кодируется ИДОМ тайла, а не флагом: сервер шлёт 1 байт на клетку (флаги в карту
// не уходят). Для 12 «зеркальных склонов» клиент берёт базовый тайл и рисует его с scaleX=-1
// (pivotX = правый край). FG-слой клиент НЕ зеркалит никогда.
const MIRROR_OF = {10:9, 4:2, 16:14, 20:18, 21:55, 22:54, 33:67, 42:62, 50:48, 64:52, 77:75, 78:73};
const MIRROR_TO = {9:10, 2:4, 14:16, 18:20, 55:21, 54:22, 67:33, 62:42, 48:50, 52:64, 75:77, 73:78};
const SPECIAL_TILE = {31:'коин-бокс (даёт монеты при ударе/прыжке)', 30:'баунс-пад (пружинит; анимируется в темах 2 и 4)'};
const SLOPE_DIR = {54:1, 55:1, 67:1, 10:1, 21:-1, 22:-1, 33:-1, 9:-1};   // +1 вверх, -1 вниз (tileSlope)
const gameTile = (id) => (MIRROR_OF[id] !== undefined ? MIRROR_OF[id] : id);  // что реально рисует клиент
// ---- каталог НПС-торговцев (data/npcs.json генерирует tools/gen-npcs.mjs) --------------
// NPC_LIST[i] = { name, kind:'shop', shop:{ type:'items'|'pets'|'craft', items:[{item,price}] }, origin, appearance }
let NPC_LIST = [];              // только торговцы, порядок как в файле
const NPC_BY = new Map();
let npcCatLoaded = false, npcCatPromise = null;
function ensureNpcCatalog(){
  if(npcCatPromise) return npcCatPromise;      // повторный вызов ждёт ТОТ ЖЕ fetch (без гонки)
  npcCatLoaded = true;
  npcCatPromise = fetch('/data/npcs.json').then(r=>r.json()).then(j=>{
    NPC_LIST = (j.npcs||[]).filter(n=>n.shop && (n.shop.type==='items' || n.shop.type==='pets'));
    NPC_LIST.forEach(n=>NPC_BY.set(n.name,n));
    return NPC_LIST;
  }).catch(()=>{
    NPC_LIST = [{name:'Item Vendor',shop:{type:'items',items:[]}},{name:'Pet Vendor',shop:{type:'pets',items:[]}}];
    NPC_LIST.forEach(n=>NPC_BY.set(n.name,n));
    return NPC_LIST;
  });
  return npcCatPromise;
}
const npcDef   = n => NPC_BY.get(n);
const npcStock = n => { const d = NPC_BY.get(n); return (d && d.shop && d.shop.items) ? d.shop.items.map(it=>it.item+'|'+(it.price|0)).join(',') : ''; };
const npcKind  = n => { const d = NPC_BY.get(n); return (d && d.shop && d.shop.type==='pets') ? 'pet' : 'vendor'; };

let showGrid = (localStorage.getItem('hh_grid') !== '0');
let sel = null;            // выделенная зона {x0,y0,x1,y1}
let selStart = null;       // начало протяжки выделения
let hover = null;          // последняя клетка под курсором ([x,y])
let clip = null;           // скопированная зона (все слои)
let TS=32;                 // масштаб сетки (px на тайл в редакторе)
let palSet='main';         // что показываем в палитре: main | fg | bg
let bgName='';             // выбранный фон (имя из атласа backgrounds1)
// ---- undo/redo, автосейв, превью фигур, видимость слоёв ----
const history = [], redoStack = [], HIST_MAX = 50;
let autosaveTimer = null;
let shapeStart = null, shapeEnd = null, shapeErase = false;   // протяжка инструментов «линия»/«прямоугольник»
const layerVis   = { main:true, water:true, g2:true, g3:true, fg:true, art:true };
const layerAlpha = { main:1, water:1, g2:1, g3:1, fg:1, art:1 };
// ---- Phase 5: блокировка слоя (правки в запертый слой не проходят) ----
const layerLock  = { main:false, water:false, g2:false, g3:false, fg:false, art:false };
// ---- Phase 3: вьюпорт (zoom/pan). Клетка на экране = TS*view.zoom px ----
let view = { zoom:1, x:0, y:0 };
let panning = null;                 // {sx,sy,vx,vy} при перетаскивании средней кнопкой
let palSearch = '';                 // Phase 4: поиск в палитре тайлов
let palFilter = (localStorage.getItem('hh_palfilter') || 'all');   // 2-й этап: фильтр палитры
// ---- Phase 6: multi-tile brush (область тайлов как кисть) ----
let brushTiles = null;              // { w,h, ids:[], sz:[], fl:[] } — паттерн кисти
let pasteMode = null;               // Phase 6: превью вставки (Ctrl+V → следует за курсором → ЛКМ)
// ---- Phase 7: выбранный объект для Properties + multi-select объектов ----
let selObj = null;                  // { kind:'portal'|'spawn'|'npc'|'atm'|'pspawn', i:number } — «главный»
let selObjs = [];                   // набор выбранных объектов (Shift+клик / рамка)
let dragObj = null;                 // перетаскивание объекта
let objBox = null;                  // рамка выделения объектов
let objClip = null;                 // скопированные объекты (Ctrl+C/V)
// ---- Phase 9: последний результат validateMap (для UI) ----
let validation = [];
let buildResult = '';               // результат последней сборки server/Map.generated.cs
// все мобы игры (data/enemyStats.json) — для выпадающего списка в спавнере
const ENEMIES = ['green bouncer','green walker','purple goo','red bouncer','mushroom squish',
  'mushroom ball','bouncing mushroom','orange crazy','yellow hairy monster','yellow puff monster',
  'horned monster','crab','plant monster','pumpkin creeper','great frog','penguin','sasquatch',
  'goo cube','brick monster','block bot','night stalker','drill bot','lotus eye','dark beholder',
  'Carnelia','leafling','leaflet','glord','kreeton','giant goo cube','repguana','Kreetus',
  'fishurn','proteum','bionic bird','titanium vulture','magmagon','aipster','mongrel','kraken',
  'bullopede','kraw','mushroom bird','flockling','chirplet','omega fluff'];
// торговцы (shop NPC) — тип лавки, как их называет игра (PayVault/GameCode)
// список питомцев игры для подсказок в редакторе (ключи = типы питомцев)
const PETS = ['tebra','babybounce','quackman','spooker','rexosaur','technotron','marshy','petri','gibler','fisky',
  'roblost','pumpman','chippy','thumper','nooter','gobloid','ritardo','ozich','topper','bunyan','quackster',
  'dwimplepike','squatch','stalkling','abomino','parashee','boopis','boopular','bunyan','charnatto'];
</script>
<script>
// ===================== assets =====================
const TILESET_MAIN = '/models/swf/DefineSprite_2970_GreenAreaTiles/1.png';
const TILESET_FG   = '/models/swf/DefineSprite_4202_GreenAreaForegroundTiles/1.png';
const PORTAL_IMG   = '/models/swf/DefineSprite_66_com.game_objects.ambient_objects.Portal/1.png';
const BG_ATLAS     = '/dynamic_content/backgrounds/backgrounds1.png';
const BG_FRAMES = [   // [имя, x, y, w, h, повёрнут] из backgrounds1.xml
  ['sky',            0, 1164,  949,  701, false],
  ['background 1',   0,  666, 1308,  498, false],
  ['background 2',   0,    0, 1308,  666, false],
  ['background 3',1354,    0,  479, 1306, true],
  ['cloud',        949, 1311,  569,   88, false]
];
const assets = {};
// --- наборы тайлов (нарезка tools/split-tiles.py + index.json) ---
let TILE_INDEX = [];                                   // [{set,kind,cols,rows,count}]
const MANIFESTS = {};                                  // set -> tiles.json
const TILES = {};                                      // set -> { id: {file,ox,oy,w,h} }
const TILE_IMG = {};                                   // 'set/file' -> Image
let SEL_MAIN = localStorage.getItem('hh_set_main') || 'GreenAreaTiles';
let SEL_FG   = localStorage.getItem('hh_set_fg')   || 'GreenAreaForegroundTiles';
function curSet(){ return palSet === 'fg' ? SEL_FG : SEL_MAIN; }
function loadManifest(set){
  if(MANIFESTS[set]) return Promise.resolve(MANIFESTS[set]);
  return fetch('/models/tiles/' + set + '/tiles.json')
    .then(r => r.json())
    .then(m => { MANIFESTS[set] = m; TILES[set] = {};
      for(const t of (m.tiles||[])) TILES[set][t.id] = t;
      return m; })
    .catch(() => { MANIFESTS[set] = {tiles:[]}; TILES[set] = {}; return MANIFESTS[set]; });
}
function tileImgFor(set, file){
  const key = set + '/' + file;
  if(TILE_IMG[key]) return TILE_IMG[key];
  const im = new Image();
  im.onload = ()=>{ if(currentTab === 'map') draw(); };
  im.src = '/models/tiles/' + set + '/' + file;
  TILE_IMG[key] = im;
  return im;
}
function ensureTileIndex(){
  if(TILE_INDEX.length) return;
  fetch('/models/tiles/index.json').then(r => r.json())
    .then(list => { TILE_INDEX = list || []; if(currentTab === 'map') renderMap(); })
    .catch(() => {});
}
function ensureAssets(){
  [['mainArt',TILESET_MAIN],['fgArt',TILESET_FG],['portal',PORTAL_IMG],['bg',BG_ATLAS]].forEach(([k,u])=>{
    if(assets[k]) return;
    const im = new Image();
    im.onload = ()=>{ assets[k]=im; if(currentTab==='map') { draw(); buildPalette(); } };
    im.onerror = ()=>{ assets[k]=null; };
    im.src = u;
  });
}
function cols(img){ return Math.max(1, Math.floor((img&&img.naturalWidth||0)/TSZ)); }
function showTab(t){
  currentTab = t;
  document.getElementById('tabMap').classList.toggle('on', t==='map');
  document.getElementById('tabObj').classList.toggle('on', t==='objects');
  document.getElementById('tabEquip').classList.toggle('on', t==='equip');

}
function render(){

  else if(currentTab === 'objects') renderObjectsTab();
  else renderMap();
}

// ===================== визуальная палитра тайлов (нарезанные PNG + манифест) =====================
// ---- Phase 4/6: выбор области тайлов В ПАЛИТРЕ (протянуть мышью) -> кисть-паттерн ----
const PAL_ITEM = 36, PAL_GAP = 3;
let palShown = [], palCols = 1, palDrag = null, palSelRect = null;
function palIndexFromEvent(e){
  const g = document.getElementById('palgrid'); if(!g) return -1;
  const r = g.getBoundingClientRect(), cw = PAL_ITEM + PAL_GAP;
  const col = Math.floor((e.clientX - r.left) / cw);
  const row = Math.floor((e.clientY - r.top) / cw);
  if(col < 0 || row < 0 || col >= palCols) return -1;
  const idx = row * palCols + col;
  return (idx >= 0 && idx < palShown.length) ? idx : -1;
}
function palMouseDown(e){
  if(e.button !== 0) return;
  const idx = palIndexFromEvent(e); if(idx < 0) return;
  e.preventDefault();
  palDrag = { start: idx, end: idx };
  renderPaletteSel();
}
function palMouseMove(e){
  if(!palDrag) return;
  const idx = palIndexFromEvent(e); if(idx < 0) return;
  if(idx !== palDrag.end){ palDrag.end = idx; renderPaletteSel(); }
}
function renderPaletteSel(){
  const g = document.getElementById('palgrid'); if(!g) return;
  let r = palSelRect;
  if(palDrag){
    const a = palDrag.start, b = palDrag.end;
    r = { c0:Math.min(a%palCols, b%palCols), r0:Math.min((a/palCols)|0, (b/palCols)|0),
          c1:Math.max(a%palCols, b%palCols), r1:Math.max((a/palCols)|0, (b/palCols)|0) };
  }
  for(const d of g.children){
    const idx = +d.dataset.idx;
    let on;
    if(r){ const c = idx % palCols, row = (idx/palCols)|0; on = (c>=r.c0 && c<=r.c1 && row>=r.r0 && row<=r.r1); }
    else  { on = (+d.dataset.id === tile); }
    if(d.classList && d.classList.toggle) d.classList.toggle('on', on);
  }
}
function finishPalDrag(){
  const d = palDrag; palDrag = null;
  if(!d) return;
  if(d.start === d.end){                       // одиночный клик — выбрать один тайл
    const t = palShown[d.start];
    palSelRect = null;
    if(t){ tile = t.id; brushTiles = null; updateBrushInfo(); renderMap(); }
    return;
  }
  const a = d.start, b = d.end;
  palSelRect = { c0:Math.min(a%palCols, b%palCols), r0:Math.min((a/palCols)|0, (b/palCols)|0),
                 c1:Math.max(a%palCols, b%palCols), r1:Math.max((a/palCols)|0, (b/palCols)|0) };
  buildBrushFromPalette(palSelRect);
  renderPaletteSel();
}
function buildBrushFromPalette(r){
  const w = r.c1 - r.c0 + 1, h = r.r1 - r.r0 + 1;
  const ids = [], sz = [], fl = [];
  for(let row=r.r0; row<=r.r1; row++) for(let c=r.c0; c<=r.c1; c++){
    const t = palShown[row*palCols + c];
    ids.push(t ? t.id : NO); sz.push(0); fl.push(0);
  }
  brushTiles = { w, h, ids, sz, fl };
  updateBrushInfo();
  setStatus('кисть-паттерн из палитры: ' + w + '×' + h + ' тайлов — рисуй кистью (B); сброс — «✕ Сброс»');
}
// ---- 2-й этап: ЗОНА -> НАБОР ТАЙЛОВ (выводим зону из имени набора, данные не меняем) ----
const ZONE_ALIAS = { RedMush: 'RedMushroom', Robo: 'Robot' };
function zoneKeyOf(set){
  let b = String(set).replace(/ForegroundTiles$/, '').replace(/AreaTiles$/, '')
                      .replace(/HouseTiles$/, '').replace(/Tiles$/, '');
  if(!b) b = String(set);
  return ZONE_ALIAS[b] || b;
}
function zoneLabel(k){
  const nice = { GreenArea:'Green Area', BlueMushroom:'Blue Mushroom', RedMushroom:'Red Mushroom',
                 MushroomHouse:'Mushroom House', PVP:'PVP' };
  return nice[k] || String(k).replace(/([a-z0-9])([A-Z])/g, '$1 $2');
}
function zonesList(){
  const m = new Map();
  for(const s of TILE_INDEX){
    const k = zoneKeyOf(s.set);
    if(!m.has(k)) m.set(k, { key:k, label:zoneLabel(k), sets:[] });
    m.get(k).sets.push(s);
  }
  const arr = [...m.values()];
  arr.forEach(z => z.sets.sort((a,b) => a.set.localeCompare(b.set)));
  arr.sort((a,b) => a.label.localeCompare(b.label));
  return arr;
}
const currentSetName = () => (palSet === 'fg' ? SEL_FG : SEL_MAIN);
// ---- 2-й этап: фильтр палитры по СУЩЕСТВУЮЩИМ данным (без новой меты) ----
const PAL_FILTERS = [['all','Все'],['special','★ спец'],['slope','⛰ склоны'],['mirror','⇄ зеркальные']];
function matchPalFilter(t){
  if(palFilter === 'special') return !!SPECIAL_TILE[t.id];
  if(palFilter === 'slope')   return SLOPE_DIR[t.id] !== undefined;
  if(palFilter === 'mirror')  return t.mirrorOf !== undefined || MIRROR_OF[t.id] !== undefined;
  return true;
}
function setPalFilter(f){
  palFilter = f;
  try{ localStorage.setItem('hh_palfilter', f); }catch(e){}
  renderPalChips(); buildPalette();
}
function renderPalChips(){
  if(!document.querySelectorAll) return;
  document.querySelectorAll('.palchip').forEach(c => {
    if(c.classList && c.classList.toggle) c.classList.toggle('on', c.dataset && c.dataset.f === palFilter);
  });
}
// поиск: по id тайла; если введено ТОЧНОЕ имя набора — переключаемся на него (пункт §7)
function onPalSearch(v){
  palSearch = v;
  const q = String(v||'').trim().toLowerCase();
  const hit = q && TILE_INDEX.find(s => s.set.toLowerCase() === q);
  if(hit){ palSearch = ''; pickSet(hit.set); return; }
  buildPalette();
}
function pickZone(key){
  const z = zonesList().find(z => z.key === key);
  if(!z || !z.sets.length) return;
  const cur = currentSetName();
  const keep = z.sets.find(s => s.set === cur);
  pickSet((keep || z.sets[0]).set);
}
function pickSet(setName){
  const s = TILE_INDEX.find(x => x.set === setName); if(!s) return;
  if(s.kind === 'fg'){ SEL_FG = setName; localStorage.setItem('hh_set_fg', SEL_FG); palSet = 'fg'; layer = 'fg'; }
  else { SEL_MAIN = setName; localStorage.setItem('hh_set_main', SEL_MAIN); palSet = 'main'; if(layer === 'fg') layer = 'main'; }
  renderMap();
}
// ---- увеличенное превью тайла при наведении (плавающий блок) ----
let palHoverEl = null;
function ensurePalHover(){
  if(palHoverEl) return palHoverEl;
  if(!document.body) return null;
  palHoverEl = document.createElement('div');
  palHoverEl.className = 'palhover';
  document.body.appendChild(palHoverEl);
  return palHoverEl;
}
function showPalHover(e, set, t){
  const el = ensurePalHover(); if(!el) return;
  const mir = (t.mirrorOf !== undefined) ? ' scaleX(-1)' : '';
  el.innerHTML = '<img src="/models/tiles/' + set + '/' + t.file + '" style="max-width:128px;max-height:128px;' +
    'image-rendering:pixelated;display:block;transform:' + (mir || 'none') + '">' +
    '<div class="gridmeta" style="text-align:center;margin:4px 0 0">id ' + t.id +
    (t.mirrorOf !== undefined ? ' · зеркало ' + t.mirrorOf : '') + '</div>';
  el.style.display = 'block';
  positionPalHover(e);
}
function positionPalHover(e){
  if(!palHoverEl || palHoverEl.style.display === 'none') return;
  const pad = 14, w = palHoverEl.offsetWidth || 140, h = palHoverEl.offsetHeight || 160;
  let x = e.clientX + pad, y = e.clientY + pad;
  if(x + w > window.innerWidth) x = e.clientX - w - pad;
  if(y + h > window.innerHeight) y = e.clientY - h - pad;
  palHoverEl.style.left = Math.max(4, x) + 'px';
  palHoverEl.style.top = Math.max(4, y) + 'px';
}
function hidePalHover(){ if(palHoverEl) palHoverEl.style.display = 'none'; }
function buildPalette(){
  const el = document.getElementById('palgrid'); if(!el) return;
  hidePalHover();
  const set = curSet();
  loadManifest(set).then(() => {
    draw();                                     // тайлы со смещениями рисуем после загрузки манифеста
    const all = (MANIFESTS[set] && MANIFESTS[set].tiles) || [];
    // 2-й этап: зеркальные записи манифеста (mirror:true / tile_N_m.png) не нужны —
    // зеркало делаем ПРОГРАММНО (scaleX(-1)) по MIRROR_OF/MIRROR_TO. Физические _m.png не грузим.
    const tiles = all.filter(t => !t.mirror && !/_m\.png$/.test(String(t.file||'')));
    el.innerHTML = '';
    if(!tiles.length){
      el.innerHTML = '<div class="gridmeta">нет нарезки для набора ' + set + '</div>';
      return;
    }
    // зеркальные тайлы: игра рисует БАЗОВЫЙ тайл с scaleX=-1, а не свою нарезку tile_N.png ->
    // в палитре показываем именно то, что будет в игре (база + зеркало). 16/33/42/77/78 в
    // нарезке отсутствуют — добавляем их из базовых.
    const have = new Set(tiles.map(t => t.id));
    const baseFile = (id) => { const b = tiles.find(t => t.id === id); return b ? b.file : null; };
    const list = [];
    for(const t of tiles){
      const mb = (palSet !== 'fg') ? MIRROR_OF[t.id] : undefined;
      const bf = mb !== undefined ? baseFile(mb) : null;
      list.push(bf ? { ...t, mirrorOf: mb, file: bf } : t);
    }
    if(palSet !== 'fg'){
      for(const [mid, base] of Object.entries(MIRROR_OF)){
        const id = +mid;
        if(have.has(id)) continue;
        const bf = baseFile(base);
        if(bf) list.push({ id, file: bf, mirrorOf: base });
      }
      list.sort((a, b) => a.id - b.id);
    }
    let shown = list;
    const q = String(palSearch||'').trim().toLowerCase();
    if(q) shown = list.filter(t => String(t.id).includes(q) || String(t.file||'').toLowerCase().includes(q));
    shown = shown.filter(matchPalFilter);          // 2-й этап: категория (все/спец/склоны/зеркальные)
    if(!shown.length){ el.innerHTML = '<div class="gridmeta">ничего не найдено' + (q ? ' по «' + esc(palSearch) + '»' : '') + (palFilter !== 'all' ? ' (фильтр: ' + palFilter + ')' : '') + '</div>'; return; }
    palShown = shown;
    const gw = (el.clientWidth || 288);
    palCols = Math.max(1, Math.floor((gw + PAL_GAP) / (PAL_ITEM + PAL_GAP)));
    el.style.display = 'grid';
    el.style.gridTemplateColumns = 'repeat(' + palCols + ', ' + PAL_ITEM + 'px)';
    el.style.gap = PAL_GAP + 'px';
    el.style.justifyContent = 'start';
    for(let k = 0; k < shown.length; k++){
      const t = shown[k];
      const usable = renderableIds(set) ? renderableIds(set).has(t.id) : true;
      const d = document.createElement('div');
      d.className = 'tilepick' + (tile === t.id ? ' on' : '');
      d.dataset.idx = String(k);
      d.dataset.id = String(t.id);
      const info = tileInfo(t.id);
      d.title = set + ' · тайл ' + t.id +
        (t.mirrorOf !== undefined ? ' (зеркальный: база ' + t.mirrorOf + ' + scaleX=-1)' : '') +
        (info ? ' — ' + info : '') +
        (usable ? '' : ' — НЕ рисуется в игре (нет в атласе темы), ставить нельзя');
      if(!usable){ d.style.opacity = '0.25'; d.style.outline = '1px dashed #b4552f'; }
      let im;
      if(t.mirrorOf !== undefined){                       // свежая картинка (кэш tileImgFor общий)
        im = new Image(); im.src = '/models/tiles/' + set + '/' + t.file;
        im.style.transform = 'scaleX(-1)';
      } else {
        im = tileImgFor(set, t.file);
      }
      im.draggable = false;
      im.style.maxWidth = '34px'; im.style.maxHeight = '34px';
      d.style.display = 'flex'; d.style.alignItems = 'center'; d.style.justifyContent = 'center';
      d.style.position = 'relative';
      d.appendChild(im);
      const badge = t.mirrorOf !== undefined ? '⇄' : (SPECIAL_TILE[t.id] ? '★' : '');
      if(badge){
        const b = document.createElement('span');
        b.textContent = badge;
        b.style.cssText = 'position:absolute;top:0;right:2px;font-size:11px;color:#ffcf6a;text-shadow:0 0 2px #000';
        d.appendChild(b);
      }
      const idb = document.createElement('span');            // id тайла мелким бейджем
      idb.textContent = String(t.id);
      idb.style.cssText = 'position:absolute;left:1px;bottom:0;font-size:9px;line-height:1;color:#cfe3ff;' +
        'text-shadow:0 0 2px #000,0 0 2px #000;pointer-events:none';
      d.appendChild(idb);
      d.onmouseenter = (e) => showPalHover(e, set, t);       // увеличенное превью
      d.onmousemove  = (e) => positionPalHover(e);
      d.onmouseleave = () => hidePalHover();
      el.appendChild(d);
    }
    el.onmousedown = palMouseDown;               // выбор области протяжкой -> кисть
    el.onmousemove = palMouseMove;
    if(palSelRect) renderPaletteSel();
  });
}

function cols(img){ return Math.max(1, Math.floor((img&&img.naturalWidth||0)/TSZ)); }
function fallbackColor(id){
  const c={40:'#5a4632',75:'#3f7d2c',9:'#7a6a52',10:'#7a6a52',25:'#2b6cb0',31:'#c9a227',77:'#6b7280',0:'#6fb7e6'};
  return c[id]||'#384150';
}
function tileImg(){ return palSet==='fg' ? assets.fgArt : assets.mainArt; }
</script>

function sizeViewport(){
  if(!mapCanvas) return;
  const wrap = document.getElementById('viewwrap'); if(!wrap) return;
  const r = wrap.getBoundingClientRect();
  mapCanvas.width  = Math.max(1, Math.floor(r.width));
  mapCanvas.height = Math.max(1, Math.floor(r.height));
}
function onWheel(e){
  e.preventDefault();
  const r = mapCanvas.getBoundingClientRect();
  const sx = (e.clientX - r.left) * (mapCanvas.width  / r.width);
  const sy = (e.clientY - r.top)  * (mapCanvas.height / r.height);
  zoomAt(sx, sy, e.deltaY < 0 ? 1.15 : 1/1.15);
}
function zoomAt(sx, sy, factor){
  const old = view.zoom;
  const nz = Math.max(0.15, Math.min(8, old * factor));
  if(nz === old) return;
  view.x = sx - (sx - view.x) * (nz / old);
  view.y = sy - (sy - view.y) * (nz / old);
  view.zoom = nz;
  const zi = document.getElementById('zoomInfo'); if(zi) zi.textContent = Math.round(nz*100) + '%';
  draw(); drawMinimap();
}
function zoomBy(f){ if(mapCanvas) zoomAt(mapCanvas.width/2, mapCanvas.height/2, f); }
function fitView(){
  if(!mapCanvas || !W || !H) return;
  const cw = mapCanvas.width, ch = mapCanvas.height;
  const z = Math.max(0.15, Math.min(4, Math.min(cw/(W*TS), ch/(H*TS)) * 0.97));
  view.zoom = z;
  view.x = (cw - W*TS*z)/2; view.y = (ch - H*TS*z)/2;
  const zi = document.getElementById('zoomInfo'); if(zi) zi.textContent = Math.round(z*100) + '%';
  draw(); drawMinimap();
}

function cellFromEvent(e){

  const sy = (e.clientY - r.top)  * (mapCanvas.height / r.height);
  const wx = (sx - view.x) / view.zoom, wy = (sy - view.y) / view.zoom;
  const x = Math.floor(wx / TS), y = Math.floor(wy / TS);
  return (x>=0 && x<W && y>=0 && y<H) ? [x,y] : null;
}
function screenFromEvent(e){
  const r = mapCanvas.getBoundingClientRect();

           (e.clientY - r.top)  * (mapCanvas.height / r.height) ];
}
function onCell(e){

    if(c0) commitPaste(c0); else cancelPaste();

    const o = objectAt(c0);

      } else if(e.shiftKey){ toggleSelObj(o); }
      else { selObjs = [o]; selObj = o; }

      if(!e.shiftKey){ selObjs = []; selObj = null; }

      renderProps(); draw(); return;
    }
    return;
  }
  dragging = true;
  const c = cellFromEvent(e); if(!c) return;
  if(tool === 'pick' || e.altKey){ pickTileAt(c[0], c[1]); dragging = false; return; }
  if(tool === 'select'){
    selStart = c;
    sel = { x0:c[0], y0:c[1], x1:c[0], y1:c[1] };
    draw(); return;
  }
  if(tool === 'fill'){ floodFill(c[0], c[1], e.button===2); return; }
  if(tool === 'line' || tool === 'rect'){ shapeStart = c; shapeEnd = c; shapeErase = (e.button === 2); draw(); return; }

}
function onCellMove(e){
  if(panning){
    const p = screenFromEvent(e);
    view.x = panning.vx + (p[0] - panning.sx);
    view.y = panning.vy + (p[1] - panning.sy);
    draw(); drawMinimap(); return;
  }
  const c0 = cellFromEvent(e); if(c0) hover = c0;
  updateHoverInfo(c0);
  if(pasteMode){ if(c0){ pasteMode.at = c0; draw(); } return; }
  if(objBox && c0){ objBox.c1 = c0[0]; objBox.r1 = c0[1]; draw(); return; }
  if(dragObj && c0){
    const dx = c0[0] - dragObj.c0[0], dy = c0[1] - dragObj.c0[1];
    if(dx || dy){
      if(!dragObj.pushed){ pushHistory(); dragObj.pushed = true; }
      if(selObjs.length > 1){ for(const o of selObjs) moveObject(o, dx, dy); }
      else moveObject(dragObj.o, dx, dy);
      dragObj.c0 = c0; draw(); drawMinimap();
    }
    return;
  }
  if(tool === 'select' && selStart && c0){
    sel = { x0:Math.min(selStart[0], c0[0]), y0:Math.min(selStart[1], c0[1]),
            x1:Math.max(selStart[0], c0[0]), y1:Math.max(selStart[1], c0[1]) };
    draw(); return;
  }
  if((tool === 'line' || tool === 'rect') && shapeStart && c0){
    shapeEnd = c0; draw(); return;
  }
  if(!dragging) return;
  if(c0 && (tool === 'paint' || tool === 'erase')) apply(c0[0], c0[1], false);
}

function selRect(){
  if(!sel) return null;

}
function copySel(){
  const r = selRect();
  if(!r){ setStatus('сначала выдели зону инструментом «⬚ Выделить зону»'); return; }
  const data = {};
  for(const [k] of LAYERS){
    const ids=[], sz=[], fl=[], ox=[], oy=[];
    for(let y=sel.y0;y<=sel.y1;y++) for(let x=sel.x0;x<=sel.x1;x++){
      const i = y*W + x;
      ids.push(area.layers[k][i]); sz.push(area.sizes[k][i]); fl.push(area.flag[k][i]);
      ox.push(area.ox[k][i]); oy.push(area.oy[k][i]);
    }
    data[k] = { ids, sz, fl, ox, oy };
  }
  clip = { w:r.w, h:r.h, data };
  setStatus('скопировано ' + r.w + '×' + r.h + ' клеток — наведи курсор и Ctrl+V');
}
// Phase 6 (п.14 ТЗ): вставка в ДВА шага — Ctrl+V включает ПРЕВЬЮ (следует за курсором),
// ЛКМ — вставить в эту точку, Esc — отмена.
function pasteSel(){
  if(clip){ pasteMode = { kind:'tiles', at: hover ? hover.slice() : [0,0] }; }
  else if(objClip && objClip.length){ pasteMode = { kind:'objs', at: hover ? hover.slice() : [0,0] }; }
  else { setStatus('сначала скопируй зону (Ctrl+C) или объекты'); return; }
  setStatus('вставка: двигай мышь, ЛКМ — вставить, Esc — отмена');
  draw();
}
function cancelPaste(){ if(pasteMode){ pasteMode = null; draw(); setStatus('вставка отменена'); } }
function commitPaste(at){
  if(!pasteMode) return;
  if(pasteMode.kind === 'tiles') pasteTilesAt(at); else pasteObjsAt(at);
  pasteMode = null;
  draw(); drawMinimap();
}
function pasteTilesAt(at){
  pushHistoryFull();
  for(const [k] of LAYERS){
    const d = clip.data[k]; if(!d) continue;
    for(let yy=0; yy<clip.h; yy++) for(let xx=0; xx<clip.w; xx++){
      const x = at[0]+xx, y = at[1]+yy;
      if(x >= W || y >= H) continue;
      const i = y*W + x, j = yy*clip.w + xx;
      area.layers[k][i] = d.ids[j]; area.sizes[k][i] = d.sz[j];
      area.flag[k][i] = d.fl[j]; area.ox[k][i] = d.ox[j]; area.oy[k][i] = d.oy[j];
    }
  }
  setStatus('вставлено ' + clip.w + '×' + clip.h + ' в ' + at[0] + ',' + at[1]);
}
function pasteObjsAt(at){
  if(!objClip || !objClip.length) return;
  const xs = [], ys = [];
  for(const it of objClip){ if(it.kind === 'pspawn'){ xs.push(it.x); ys.push(it.y); } else { xs.push(it.data[0]|0); ys.push(it.data[1]|0); } }
  const dx = at[0] - Math.min(...xs), dy = at[1] - Math.min(...ys);
  pushHistory();
  const cl = (v,mx) => Math.max(0, Math.min(mx, v));
  const created = [];
  for(const it of objClip){
    if(it.kind === 'pspawn'){ area.playerSpawn = [cl(it.x+dx,W-1), cl(it.y+dy,H-1)]; created.push({ kind:'pspawn', i:0 }); continue; }
    const d = it.data.slice();
    d[0] = cl((d[0]|0)+dx, W-1); d[1] = cl((d[1]|0)+dy, H-1);
    if(it.kind === 'portal'){ d[2] = Math.max(0, ...area.portals.map(p => p[2])) + 1; area.portals.push(d); created.push({ kind:'portal', i:area.portals.length-1 }); }
    else if(it.kind === 'spawn'){ area.spawns.push(d); created.push({ kind:'spawn', i:area.spawns.length-1 }); }
    else if(it.kind === 'npc'){ area.npcs.push(d); created.push({ kind:'npc', i:area.npcs.length-1 }); }
    else if(it.kind === 'atm'){ area.atms.push(d); created.push({ kind:'atm', i:area.atms.length-1 }); }
  }
  selObjs = created; selObj = created.length ? created[created.length-1] : null;
  renderObjLists(); renderProps();
  setStatus('вставлено объектов: ' + created.length);
}
function drawPastePreview(ctx, z){
  if(!pasteMode) return;
  const at = pasteMode.at;
  ctx.save();
  if(pasteMode.kind === 'tiles' && clip){
    ctx.globalAlpha = 0.55;
    const d = clip.data[targetLayer()];
    if(d) for(let yy=0; yy<clip.h; yy++) for(let xx=0; xx<clip.w; xx++){
      const id = d.ids[yy*clip.w+xx];
      if(id === NO) continue;
      const x = at[0]+xx, y = at[1]+yy;
      if(x >= W || y >= H) continue;
      ctx.fillStyle = fallbackColor(id); ctx.fillRect(x*TS, y*TS, TS, TS);
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = '#ffcf6a'; ctx.lineWidth = 2/z; ctx.setLineDash([5/z,3/z]);
    ctx.strokeRect(at[0]*TS, at[1]*TS, clip.w*TS, clip.h*TS);
  } else if(pasteMode.kind === 'objs' && objClip){
    ctx.fillStyle = 'rgba(62,207,106,0.25)'; ctx.fillRect(at[0]*TS, at[1]*TS, TS, TS);
    ctx.strokeStyle = '#3ecf6a'; ctx.lineWidth = 2/z; ctx.setLineDash([5/z,3/z]);
    ctx.strokeRect(at[0]*TS, at[1]*TS, TS, TS);
  }
  ctx.restore();
}
function clearSel(){ sel = null; selStart = null; draw(); }
// Зеркало = подставить ЗЕРКАЛЬНЫЙ ID тайла (клиент рисует базу с scaleX=-1).

function mirrorBrush(){

    return;
  }
  if(MIRROR_OF[tile] !== undefined){
    const m = tile; tile = MIRROR_OF[m]; renderMap();

    return;
  }
  setStatus('у тайла ' + tile + ' нет зеркальной версии: клиент зеркалит только 9↔10, 2↔4, 14↔16, ' +
    '18↔20, 55↔21, 54↔22, 67↔33, 62↔42, 48↔50, 52↔64, 75↔77, 73↔78 (и только слой main; FG не зеркалится)');
}
function tileInfo(id){
  const parts = [];
  if(SPECIAL_TILE[id]) parts.push(SPECIAL_TILE[id]);
  if(MIRROR_OF[id] !== undefined) parts.push('зеркальный: ' + MIRROR_OF[id] + ' + scaleX=-1');
  if(SLOPE_DIR[id] !== undefined) parts.push('склон ' + (SLOPE_DIR[id] > 0 ? 'вверх' : 'вниз') + ' (slope ' + (SLOPE_DIR[id]*27) + ')');
  return parts.join('; ');
}
function pickTile(id){
  tile = id; renderMap();
  const inf = tileInfo(id);
  setStatus('выбран тайл ' + id + (inf ? ' — ' + inf : ''));

function setTile(L, x, y, erase){
  if(layerLock[L]){ setStatus('🔒 слой заперт — сними замок в панели «Слои»'); return; }
  if(x<0 || x>=W || y<0 || y>=H) return;
  if(!erase && !tileRenderable(L, tile)){          // id вне атласа темы -> в игре краш #1009
    setStatus('⛔ тайл ' + tile + ' не рисуется в игре (его нет в атласе набора ' + setForLayer(L) +
      ') — не ставлю. Выбери тайл из палитры, соответствующей слою.');
    return;
  }
  const i = y*W + x;
  recordCell(L, i);                               // Phase 12: дельта для undo
  if(erase){ area.layers[L][i]=NO; area.sizes[L][i]=0; area.flag[L][i]=0; area.ox[L][i]=0; area.oy[L][i]=0; }
  else { area.layers[L][i]=tile; area.sizes[L][i]=0; area.flag[L][i]=0; area.ox[L][i]=0; area.oy[L][i]=0; }
}
function apply(x,y,rightClick){
  const L = targetLayer();
  if(rightClick || tool==='erase'){ setTile(L, x, y, true); draw(); return; }
  if(tool==='paint'){ if(brushTiles) stampBrush(x, y); else setTile(L, x, y, false); draw(); }
  else if(tool==='portal'){ area.portals.push([x,y, area.portals.length?Math.max(...area.portals.map(p=>p[2]))+1:1, '', 0]); renderPortalList(); draw(); }
  else if(tool==='spawn'){ area.spawns.push([x,y,Math.max(0,x-3),Math.min(W-1,x+3),'']); renderSpawnList(); draw(); }
  else if(tool==='shop'){ area.npcs.push([x, y, (NPC_LIST[0]||{name:'Item Vendor'}).name, '']); renderShopList(); draw(); }
  else if(tool==='atm'){ area.atms.push([x,y]); renderAtmList(); draw(); }
  else if(tool==='pspawn'){ area.playerSpawn=[x,y]; draw(); }
}
// --- заливка / фигуры / пипетка ---
function floodFill(x, y, erase){
  const L = targetLayer();
  if(x<0 || x>=W || y<0 || y>=H) return;
  const target = area.layers[L][y*W + x];
  if(!erase && target === tile){ setStatus('уже этот тайл'); return; }
  pushHistory();
  const seen = new Uint8Array(W*H);
  const stack = [[x,y]];
  while(stack.length){
    const [cx,cy] = stack.pop();
    if(cx<0 || cx>=W || cy<0 || cy>=H) continue;
    const i = cy*W + cx;
    if(seen[i]) continue; seen[i] = 1;
    if(area.layers[L][i] !== target) continue;
    setTile(L, cx, cy, erase);
    stack.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
  }
  draw();
}
function shapeCells(){
  const [x0,y0] = shapeStart, [x1,y1] = shapeEnd, out = [];
  if(tool === 'line'){
    let dx = Math.abs(x1-x0), dy = Math.abs(y1-y0), sx = x0<x1?1:-1, sy = y0<y1?1:-1, err = dx-dy, x = x0, y = y0;
    while(true){ out.push([x,y]); if(x===x1 && y===y1) break; const e2 = 2*err; if(e2 > -dy){ err -= dy; x += sx; } if(e2 < dx){ err += dx; y += sy; } }
  } else {
    for(let yy=Math.min(y0,y1); yy<=Math.max(y0,y1); yy++) for(let xx=Math.min(x0,x1); xx<=Math.max(x0,x1); xx++) out.push([xx,yy]);
  }
  return out;
}
function commitShape(){
  if(!shapeStart || !shapeEnd){ shapeStart = shapeEnd = null; return; }
  pushHistory();
  const L = targetLayer();
  for(const [x,y] of shapeCells()) setTile(L, x, y, shapeErase);
  shapeStart = shapeEnd = null;
  draw();
}
function pickTileAt(x, y){
  const L = targetLayer();
  if(x<0 || x>=W || y<0 || y>=H) return;
  const i = y*W + x, v = area.layers[L][i];
  if(v === NO){ setStatus('пустая клетка'); return; }
  tile = v;
  setStatus('пипетка: тайл ' + v);
  renderMap();
}
function saveBgOnly(){ draw(); }

function drawBackdrop(ctx,cw,ch){
  const f = BG_FRAMES.find(f=>f[0]===bgName);
  if(f && assets.bg && assets.bg.naturalWidth){
    ctx.drawImage(assets.bg, f[1], f[2], f[3], f[4], 0, 0, cw, ch);
    return;
  }
  const g = ctx.createLinearGradient(0,0,0,ch);
  g.addColorStop(0,'#8fd0f2'); g.addColorStop(1,'#d8ecf7');
  ctx.fillStyle=g; ctx.fillRect(0,0,cw,ch);
}

function draw(){
  if(!mapCanvas) return;
  const ctx = mapCanvas.getContext('2d'), cw = mapCanvas.width, ch = mapCanvas.height;
  drawBackdrop(ctx,cw,ch);
  paintScene(ctx, cw, ch, view.zoom, view.x, view.y, true);
  updateHud();
}
function updateHud(){
  const el = document.querySelector('.hud'); if(!el) return;
  const c = hover ? (hover[0]+','+hover[1]) : '—';
  let v = '—';
  if(hover){ const t = area.layers[layer][hover[1]*W + hover[0]]; if(t !== undefined && t !== NO) v = t; }
  el.innerHTML = W+'×'+H+' · слой: <b>'+esc(LAYER_BY_KEY[layer][1].split(' — ')[0])+'</b> · клетка: <b>'+c+
    '</b> · тайл: <b>'+v+'</b> · зум <b>'+Math.round(view.zoom*100)+'%</b> · история <b>'+history.length+'</b>';
}
// рисование сцены в заданном трансформе (вьюпорт: visibleOnly=true; PNG: z=1,ox=oy=0)
function paintScene(ctx, cw, ch, z, oxv, oyv, visibleOnly){
  ctx.setTransform(z,0,0,z,oxv,oyv);
  const k = TS / TSZ;
  const x0 = visibleOnly ? Math.max(0, Math.floor(-oxv/(TS*z))) : 0;
  const y0 = visibleOnly ? Math.max(0, Math.floor(-oyv/(TS*z))) : 0;
  const x1 = visibleOnly ? Math.min(W-1, Math.floor((cw - oxv)/(TS*z))) : W-1;
  const y1 = visibleOnly ? Math.min(H-1, Math.floor((ch - oyv)/(TS*z))) : H-1;
  for(const lay of LAYER_DRAW_ORDER){
    if(layerVis[lay] === false) continue;
    ctx.save(); ctx.globalAlpha = (layerAlpha[lay]!=null?layerAlpha[lay]:1);
    const arr = area.layers[lay], sz = area.sizes[lay], fl = area.flag[lay];
    const oxa = area.ox[lay], oya = area.oy[lay];
    const set = (lay === 'fg') ? SEL_FG : SEL_MAIN;
    const byId = TILES[set] || {};
    const atlas = (lay === 'fg') ? assets.fgArt : assets.mainArt;
    for(let y=y0; y<=y1; y++) for(let x=x0; x<=x1; x++){
      const i = y*W + x;
      const v = arr[i]; if(v===NO) continue;
      const f = fl && fl[i] ? fl[i] : 0;
      const rot = ((f>>2)&3) * Math.PI/2;
      // зеркало = ИД тайла (как в игре); флаг-зеркало не используем, FG клиент не зеркалит
      const idMirror = (lay !== 'fg') && MIRROR_OF[v] !== undefined;
      const vSrc = idMirror ? MIRROR_OF[v] : v;
      const fh = idMirror ? -1 : 1, fv = 1;
      const ux = (oxa && oxa[i] ? oxa[i] : 0) * k;
      const uy = (oya && oya[i] ? oya[i] : 0) * k;
      const mul = (sz && sz[i]) ? sz[i]/100 : 1;
      const t = byId[vSrc];
      let img, sx = 0, sy = 0, dw, dh, cx, cy, trimmed = false;
      if(t){
        img = tileImgFor(set, t.file);
        if(!img.complete || !img.naturalWidth) continue;      // дорисуется по onload
        dw = t.w * k * mul; dh = t.h * k * mul;
        // зеркало по H: пивот = правый край клетки (клиент: scaleX=-1, pivotX=width) ->
        // положение тайла внутри клетки тоже зеркалится: ox' = TSZ - ox - w
        const oxEff = idMirror ? (TSZ - t.ox - t.w) : t.ox;
        cx = x*TS + oxEff*k + ux + (t.w*k)/2;
        cy = y*TS + t.oy*k + uy + (t.h*k)/2;
        trimmed = true;
      } else if(atlas && atlas.naturalWidth){
        img = atlas;
        const nc = cols(img);
        sx = (vSrc%nc)*TSZ; sy = ((vSrc/nc)|0)*TSZ;
        const s = (sz && sz[i] ? TS*sz[i]/100 : TS);
        dw = dh = s;
        cx = x*TS + (TS-s)/2 + ux + s/2;
        cy = y*TS + (TS-s)/2 + uy + s/2;
      } else {
        ctx.fillStyle = fallbackColor(vSrc); ctx.fillRect(x*TS + ux, y*TS + uy, TS, TS); continue;
      }
      ctx.save();
      ctx.translate(cx, cy);
      if(rot) ctx.rotate(rot);
      if(fh !== 1 || fv !== 1) ctx.scale(fh, fv);
      if(trimmed) ctx.drawImage(img, -dw/2, -dh/2, dw, dh);
      else ctx.drawImage(img, sx, sy, TSZ, TSZ, -dw/2, -dh/2, dw, dh);
      ctx.restore();
    }
    ctx.restore();
  }
  if(showGrid && TS*z >= 7){
    ctx.strokeStyle='rgba(0,0,0,0.16)'; ctx.lineWidth = 1/z;
    for(let x=x0;x<=x1+1;x++){ctx.beginPath();ctx.moveTo(x*TS,y0*TS);ctx.lineTo(x*TS,(y1+1)*TS);ctx.stroke();}
    for(let y=y0;y<=y1+1;y++){ctx.beginPath();ctx.moveTo(x0*TS,y*TS);ctx.lineTo((x1+1)*TS,y*TS);ctx.stroke();}
  }
  ctx.save(); ctx.strokeStyle='rgba(79,157,255,0.5)'; ctx.lineWidth = 1/z;
  ctx.strokeRect(0,0,W*TS,H*TS); ctx.restore();
  if(sel){
    ctx.save();
    ctx.strokeStyle = '#4f9dff'; ctx.setLineDash([6,4]); ctx.lineWidth = 2;
    ctx.strokeRect(sel.x0*TS + 0.5, sel.y0*TS + 0.5,
                   (sel.x1-sel.x0+1)*TS - 1, (sel.y1-sel.y0+1)*TS - 1);
    ctx.restore();
  }
  if(area.playerSpawn){
    const [px,py] = area.playerSpawn;
    ctx.fillStyle='rgba(62,207,106,0.85)';
    ctx.beginPath(); ctx.arc(px*TS+TS/2, py*TS+TS/2, TS*0.34, 0, 6.2832); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font=`bold ${(TS*0.45)|0}px sans`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('P', px*TS+TS/2, py*TS+TS/2);
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  }
  area.portals.forEach(p=>{
    if(assets.portal && assets.portal.naturalWidth)
      ctx.drawImage(assets.portal, p[0]*TS, p[1]*TS-TS*0.25, TS*0.85, TS*0.95);
    else { ctx.fillStyle='#ff5c5c'; ctx.fillRect(p[0]*TS,p[1]*TS,TS,TS); }
    ctx.fillStyle='#fff'; ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.lineWidth=2;
    ctx.font=(TS>=24?'bold 10px':'bold 8px')+' sans';
    const lbl = '№' + p[2] + (p[3] ? ' → ' + p[3] : '');
    ctx.strokeText(lbl, p[0]*TS+2, p[1]*TS+10);
    ctx.fillText(lbl, p[0]*TS+2, p[1]*TS+10);
    ctx.lineWidth=1;
  });
  (area.npcs||[]).forEach(s=>{
    const pet = npcKind(s[2]) === 'pet';
    ctx.fillStyle = pet ? 'rgba(120,90,220,0.9)' : 'rgba(230,190,60,0.92)';
    ctx.beginPath(); ctx.arc(s[0]*TS+TS/2, s[1]*TS+TS/2, TS*0.32, 0, 6.2832); ctx.fill();
    ctx.fillStyle='#fff'; ctx.font='bold '+Math.max(8,(TS*0.42)|0)+'px sans'; ctx.textAlign='center';
    ctx.fillText(pet ? 'П' : 'Н', s[0]*TS+TS/2, s[1]*TS+TS*0.64);
    ctx.textAlign='left';
  });
  (area.atms||[]).forEach(a=>{
    const x = a[0]*TS, y = a[1]*TS;
    ctx.fillStyle = 'rgba(40,150,220,0.92)';
    ctx.fillRect(x+TS*0.18, y+TS*0.14, TS*0.64, TS*0.72);
    ctx.fillStyle = '#fff'; ctx.font='bold '+Math.max(8,(TS*0.4)|0)+'px sans'; ctx.textAlign='center';
    ctx.fillText('ATM', x+TS/2, y+TS*0.62);
    ctx.textAlign='left';
  });
  area.spawns.forEach(s=>{
    ctx.fillStyle='rgba(255,140,0,0.9)';
    ctx.beginPath(); ctx.arc(s[0]*TS+TS/2,s[1]*TS+TS/2,TS*0.3,0,6.2832); ctx.fill();
    ctx.fillStyle='#7a3b00';
    ctx.beginPath(); ctx.arc(s[0]*TS+TS/2,s[1]*TS+TS/2,TS*0.12,0,6.2832); ctx.fill();
  });
  if(shapeStart && shapeEnd && (tool==='line' || tool==='rect')){
    ctx.save();
    ctx.fillStyle = shapeErase ? 'rgba(255,80,80,0.45)' : 'rgba(79,157,255,0.45)';
    for(const [x,y] of shapeCells()){ if(x>=0&&x<W&&y>=0&&y<H) ctx.fillRect(x*TS, y*TS, TS, TS); }
    ctx.restore();
  }
  if(visibleOnly){
    // Phase 6: превью multi-tile brush
    if(brushTiles && hover){
      ctx.save(); ctx.strokeStyle = '#ffcf6a'; ctx.lineWidth = 1.5/z; ctx.setLineDash([4/z,3/z]);
      ctx.strokeRect(hover[0]*TS, hover[1]*TS, brushTiles.w*TS, brushTiles.h*TS); ctx.restore();
    }
    // Phase 6: превью вставки (Ctrl+V → курсор → ЛКМ)
    drawPastePreview(ctx, z);
    // Phase 7: рамки выбранных объектов (multi-select)
    if(selObjs.length || selObj){
      const list = selObjs.length ? selObjs : [selObj];
      ctx.save(); ctx.strokeStyle = '#4f9dff'; ctx.lineWidth = 2/z;
      for(const o of list){ const b = objCell(o); if(b) ctx.strokeRect(b[0]*TS - 2/z, b[1]*TS - 2/z, TS + 4/z, TS + 4/z); }
      ctx.restore();
    }
    // Phase 7: рамка выделения объектов (протяжка)
    if(objBox){
      const c0 = Math.min(objBox.c0,objBox.c1), c1 = Math.max(objBox.c0,objBox.c1);
      const r0 = Math.min(objBox.r0,objBox.r1), r1 = Math.max(objBox.r0,objBox.r1);
      ctx.save(); ctx.fillStyle = 'rgba(79,157,255,0.15)'; ctx.strokeStyle = '#4f9dff';
      ctx.lineWidth = 1.5/z; ctx.setLineDash([5/z,3/z]);
      ctx.fillRect(c0*TS, r0*TS, (c1-c0+1)*TS, (r1-r0+1)*TS);
      ctx.strokeRect(c0*TS, r0*TS, (c1-c0+1)*TS, (r1-r0+1)*TS);
      ctx.restore();
    }
    // подсветка клетки под курсором
    if(hover){ ctx.save(); ctx.strokeStyle = 'rgba(255,255,255,0.85)'; ctx.lineWidth = 1.5/z;
      ctx.strokeRect(hover[0]*TS + 0.5/z, hover[1]*TS + 0.5/z, TS - 1/z, TS - 1/z); ctx.restore(); }
  }
  ctx.setTransform(1,0,0,1,0,0);
}
// полная карта в offscreen-канвас (для PNG-экспорта)
function renderFullMap(){
  const cv = document.createElement('canvas');
  cv.width = W*TS; cv.height = H*TS;
  const c = cv.getContext('2d');
  drawBackdrop(c, cv.width, cv.height);
  paintScene(c, cv.width, cv.height, 1, 0, 0, false);
  return cv;
}
function objCell(o){
  if(!o) return null;
  if(o.kind==='pspawn') return area.playerSpawn;
  if(o.kind==='portal') return area.portals[o.i];
  if(o.kind==='npc')    return area.npcs[o.i];
  if(o.kind==='atm')    return area.atms[o.i];
  if(o.kind==='spawn')  return area.spawns[o.i];
  return null;
}

function deleteSelObj(){
  if(!selObj) return;
  pushHistory();
  const kind = selObj.kind, i = selObj.i;
  if(kind==='portal') area.portals.splice(i,1);
  else if(kind==='spawn') area.spawns.splice(i,1);
  else if(kind==='npc') area.npcs.splice(i,1);
  else if(kind==='atm') area.atms.splice(i,1);
  else if(kind==='pspawn') area.playerSpawn = null;
  selObj = null;
  renderPortalList(); renderSpawnList(); renderShopList(); renderAtmList(); renderProps(); draw(); drawMinimap();
}
function objectAt(c){
  if(!c) return null;
  const x = c[0], y = c[1];
  if(area.playerSpawn && area.playerSpawn[0]===x && area.playerSpawn[1]===y) return { kind:'pspawn', i:0 };
  for(let i=0;i<area.portals.length;i++) if(area.portals[i][0]===x && area.portals[i][1]===y) return { kind:'portal', i };
  for(let i=0;i<(area.npcs||[]).length;i++) if(area.npcs[i][0]===x && area.npcs[i][1]===y) return { kind:'npc', i };
  for(let i=0;i<(area.atms||[]).length;i++) if(area.atms[i][0]===x && area.atms[i][1]===y) return { kind:'atm', i };
  for(let i=0;i<area.spawns.length;i++) if(area.spawns[i][0]===x && area.spawns[i][1]===y) return { kind:'spawn', i };
  return null;
}
function moveObject(o, dx, dy){
  const cl = (v,mx)=>Math.max(0, Math.min(mx, v));
  if(o.kind==='pspawn'){ if(area.playerSpawn) area.playerSpawn = [cl(area.playerSpawn[0]+dx,W-1), cl(area.playerSpawn[1]+dy,H-1)]; return; }
  const arr = o.kind==='portal' ? area.portals : o.kind==='npc' ? area.npcs : o.kind==='atm' ? area.atms : o.kind==='spawn' ? area.spawns : null;
  if(!arr) return;
  const p = arr[o.i]; if(!p) return;
  p[0] = cl(p[0]+dx, W-1); p[1] = cl(p[1]+dy, H-1);
}

}
function objKey(o){ return o.kind + ':' + o.i; }
function objInSel(o){ const k = objKey(o); return selObjs.some(s => objKey(s) === k); }
function toggleSelObj(o){
  const k = objKey(o), idx = selObjs.findIndex(s => objKey(s) === k);
  if(idx >= 0) selObjs.splice(idx, 1); else selObjs.push(o);
  selObj = selObjs.length ? selObjs[selObjs.length-1] : null;
  renderProps(); draw();
}
function objectsInRect(c0, r0, c1, r1){
  const out = [], inR = (x,y) => x >= c0 && x <= c1 && y >= r0 && y <= r1;
  area.portals.forEach((p,i) => { if(inR(p[0],p[1])) out.push({ kind:'portal', i }); });
  (area.npcs||[]).forEach((n,i) => { if(inR(n[0],n[1])) out.push({ kind:'npc', i }); });
  (area.atms||[]).forEach((a,i) => { if(inR(a[0],a[1])) out.push({ kind:'atm', i }); });
  area.spawns.forEach((s,i) => { if(inR(s[0],s[1])) out.push({ kind:'spawn', i }); });
  if(area.playerSpawn && inR(area.playerSpawn[0], area.playerSpawn[1])) out.push({ kind:'pspawn', i:0 });
  return out;
}
function finishObjBox(){
  const b = objBox; objBox = null;
  if(!b) return;
  const c0 = Math.min(b.c0,b.c1), c1 = Math.max(b.c0,b.c1);
  const r0 = Math.min(b.r0,b.r1), r1 = Math.max(b.r0,b.r1);
  const found = objectsInRect(c0, r0, c1, r1);
  selObjs = found; selObj = found.length ? found[found.length-1] : null;
  renderProps(); draw();
  setStatus('выделено объектов: ' + found.length);
}
function renderObjLists(){ renderPortalList(); renderSpawnList(); renderShopList(); renderAtmList(); }
function moveSelObjs(dx, dy){

}
function deleteSelObjs(){
  if(!selObjs.length) return;
  pushHistory();
  const byKind = {};
  for(const o of selObjs){ (byKind[o.kind] = byKind[o.kind] || []).push(o.i); }
  for(const kind in byKind){
    const idxs = byKind[kind].sort((a,b) => b - a);       // с конца — индексы не съезжают
    for(const i of idxs){
      if(kind === 'portal') area.portals.splice(i,1);
      else if(kind === 'spawn') area.spawns.splice(i,1);
      else if(kind === 'npc') area.npcs.splice(i,1);
      else if(kind === 'atm') area.atms.splice(i,1);
      else if(kind === 'pspawn') area.playerSpawn = null;
    }
  }
  selObjs = []; selObj = null;
  renderObjLists(); renderProps(); draw(); drawMinimap();
}
function copyObjs(){
  if(!selObjs.length) return;
  objClip = selObjs.map(o => {
    const c = objCell(o);
    if(o.kind === 'pspawn') return { kind:'pspawn', x:c[0], y:c[1] };
    const arr = o.kind==='portal' ? area.portals : o.kind==='npc' ? area.npcs : o.kind==='atm' ? area.atms : area.spawns;
    return { kind:o.kind, data: arr[o.i].slice() };
  });
  setStatus('скопировано объектов: ' + objClip.length + ' — Ctrl+V, чтобы вставить');
}
function pasteObjs(){
  if(!objClip || !objClip.length) return;
  pushHistory();
  const cl = (v,mx) => Math.max(0, Math.min(mx, v));
  const created = [];
  for(const it of objClip){
    if(it.kind === 'pspawn'){ area.playerSpawn = [cl(it.x+1,W-1), cl(it.y+1,H-1)]; created.push({ kind:'pspawn', i:0 }); continue; }
    const d = it.data.slice();
    d[0] = cl((d[0]|0)+1, W-1); d[1] = cl((d[1]|0)+1, H-1);
    if(it.kind === 'portal'){ d[2] = Math.max(0, ...area.portals.map(p => p[2])) + 1; area.portals.push(d); created.push({ kind:'portal', i:area.portals.length-1 }); }
    else if(it.kind === 'spawn'){ area.spawns.push(d); created.push({ kind:'spawn', i:area.spawns.length-1 }); }
    else if(it.kind === 'npc'){ area.npcs.push(d); created.push({ kind:'npc', i:area.npcs.length-1 }); }
    else if(it.kind === 'atm'){ area.atms.push(d); created.push({ kind:'atm', i:area.atms.length-1 }); }
  }
  selObjs = created; selObj = created.length ? created[created.length-1] : null;
  renderObjLists(); renderProps(); draw(); drawMinimap();
  setStatus('вставлено объектов: ' + created.length);
}

  });

  for(const it of list){

    d[0] = cl((d[0]|0)+1, W-1); d[1] = cl((d[1]|0)+1, H-1);
    if(it.kind === 'portal'){ d[2] = Math.max(0, ...area.portals.map(p => p[2])) + 1; area.portals.push(d); created.push({ kind:'portal', i:area.portals.length-1 }); }
    else if(it.kind === 'spawn'){ area.spawns.push(d); created.push({ kind:'spawn', i:area.spawns.length-1 }); }
    else if(it.kind === 'npc'){ area.npcs.push(d); created.push({ kind:'npc', i:area.npcs.length-1 }); }

function validationJump(msg){
  const m = /\((\d+)\s*,\s*(\d+)\)/.exec(String(msg||''));
  if(!m){ setStatus('в этом сообщении нет координат клетки'); return; }
  if(!mapCanvas) return;
  const TSz = TS*view.zoom;
  view.x = mapCanvas.width/2  - (+m[1] + 0.5)*TSz;
  view.y = mapCanvas.height/2 - (+m[2] + 0.5)*TSz;
  draw(); drawMinimap();
  setStatus('переход к клетке ' + m[1] + ',' + m[2]);
}
function runValidation(){ validation = validateMap(); renderValidation(); return validation; }
function validationWarnings(){
  const w = [];
  if(!area.portals.length) w.push('нет порталов — игрок не сможет покинуть карту');
  if(!(area.spawns||[]).length) w.push('нет спавнов мобов');
  if(!(area.npcs||[]).length) w.push('нет НПС-торговцев');
  return w;
}
function renderValidation(){
  const el = document.getElementById('validBox'); if(!el) return;
  const warns = validationWarnings();
  let html = '';
  if(validation.length) html += validation.map((m,i)=>`<div class="vitem err" style="cursor:pointer" title="клик — перейти к проблемной клетке" onclick="validationJump(validation[${i}])">🔴 ${esc(m)}</div>`).join('');
  if(warns.length) html += warns.map(m=>`<div class="vitem warn">🟡 ${esc(m)}</div>`).join('');
  if(!html) html = '<div class="vitem info">🔵 Замечаний нет. Нажми «🔍 Проверить» или «▶ TEST» перед сохранением.</div>';
  if(buildResult) html += `<div class="vitem info">🔵 ${esc(buildResult)}</div>`;
  el.innerHTML = html;
}
function mmColor(id){
  const c = {0:'#6fb7e2',25:'#2b6cb0',36:'#6fae3f',38:'#5a4632',40:'#4a6b2a',75:'#3f7d2c',120:'#c9a227'};
  return c[id] || '#3a4a5a';
}
function drawMinimap(){
  const cv = document.getElementById('minimap'); if(!cv) return;
  const scale = Math.max(1, Math.floor(288 / Math.max(1, W)));
  const w = W*scale, h = H*scale;
  if(cv.width !== w) cv.width = w;
  if(cv.height !== h) cv.height = h;
  const g = cv.getContext('2d');
  g.fillStyle = '#0d0f13'; g.fillRect(0,0,w,h);
  const main = area.layers.main;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const v = main[y*W+x]; if(v===NO) continue;
    g.fillStyle = mmColor(v); g.fillRect(x*scale, y*scale, scale, scale);
  }
  const water = area.layers.water;
  g.fillStyle = 'rgba(43,108,176,0.75)';
  for(let y=0;y<H;y++) for(let x=0;x<W;x++) if(water[y*W+x]!==NO) g.fillRect(x*scale, y*scale, scale, scale);
  const dot = (x,y,c)=>{ g.fillStyle=c; g.fillRect(x*scale, y*scale, Math.max(2,scale), Math.max(2,scale)); };
  area.portals.forEach(p=>dot(p[0],p[1],'#ff5c5c'));
  (area.npcs||[]).forEach(p=>dot(p[0],p[1],'#e6be3c'));
  (area.atms||[]).forEach(p=>dot(p[0],p[1],'#2896dc'));
  area.spawns.forEach(p=>dot(p[0],p[1],'#ff8c00'));
  if(area.playerSpawn) dot(area.playerSpawn[0], area.playerSpawn[1], '#3ecf6a');
  if(mapCanvas){
    const TSz = TS*view.zoom;
    const vx = (-view.x)/TSz, vy = (-view.y)/TSz;
    const vw = mapCanvas.width/TSz, vh = mapCanvas.height/TSz;
    g.strokeStyle = '#4f9dff'; g.lineWidth = 1;
    g.strokeRect(vx*scale, vy*scale, vw*scale, vh*scale);
  }
}
function mmClick(e){
  const cv = document.getElementById('minimap'); if(!cv || !mapCanvas) return;
  const r = cv.getBoundingClientRect();
  const mx = (e.clientX - r.left) / r.width  * W;
  const my = (e.clientY - r.top ) / r.height * H;
  const TSz = TS*view.zoom;
  view.x = mapCanvas.width/2  - mx*TSz;
  view.y = mapCanvas.height/2 - my*TSz;
  draw(); drawMinimap();
}
function takeBrush(){
  if(!sel){ setStatus('сначала выдели зону инструментом «⬚»'); return; }
  const L = targetLayer(), w = sel.x1-sel.x0+1, h = sel.y1-sel.y0+1;
  const ids=[], sz=[], fl=[];
  for(let y=sel.y0;y<=sel.y1;y++) for(let x=sel.x0;x<=sel.x1;x++){
    const i=y*W+x; ids.push(area.layers[L][i]); sz.push(area.sizes[L][i]); fl.push(area.flag[L][i]);
  }
  brushTiles = { w, h, ids, sz, fl };
  updateBrushInfo(); setStatus('кисть-паттерн '+w+'×'+h+' (слой '+LAYER_BY_KEY[L][1].split(' — ')[0]+') — рисуй кистью');
}
function clearBrush(){ brushTiles = null; updateBrushInfo(); draw(); }
function mirrorBrushPattern(){
  if(!brushTiles){ setStatus('кисть-паттерн не задан'); return; }
  const b = brushTiles, ids = [], sz = [], fl = [];
  for(let y=0; y<b.h; y++){
    for(let x=b.w-1; x>=0; x--){                       // зеркалим порядок в строке
      const j = y*b.w + x, id = b.ids[j];
      const mid = (id !== NO && MIRROR_TO[id] !== undefined) ? MIRROR_TO[id]
                : (id !== NO && MIRROR_OF[id] !== undefined) ? MIRROR_OF[id] : id;
      ids.push(mid); sz.push(b.sz[j]); fl.push(b.fl[j]);
    }
  }
  brushTiles = { w:b.w, h:b.h, ids, sz, fl };
  updateBrushInfo(); draw();
  setStatus('паттерн зеркалён (id, у которых клиент умеет зеркало, заменены на зеркальные)');
}
function updateBrushInfo(){
  const el = document.getElementById('brushInfo'); if(!el) return;
  el.textContent = brushTiles
    ? ('паттерн ' + brushTiles.w + '×' + brushTiles.h + ' — ставится целиком при рисовании')
    : 'кисть-паттерн не задан: выдели зону инструментом «⬚» и нажми «🎯 Взять выделение как кисть»';
}
function stampBrush(x0, y0){
  const L = targetLayer(), b = brushTiles; if(!b) return;
  for(let yy=0; yy<b.h; yy++) for(let xx=0; xx<b.w; xx++){
    const px = x0+xx, py = y0+yy; if(px<0||px>=W||py<0||py>=H) continue;
    const i = py*W+px, j = yy*b.w+xx, id = b.ids[j];
    recordCell(L, i);                             // Phase 12: дельта для undo
    if(id===NO){ area.layers[L][i]=NO; area.sizes[L][i]=0; area.flag[L][i]=0; area.ox[L][i]=0; area.oy[L][i]=0; continue; }
    if(!tileRenderable(L, id)) continue;
    area.layers[L][i]=id; area.sizes[L][i]=b.sz[j]||0; area.flag[L][i]=b.fl[j]||0;
    area.ox[L][i]=0; area.oy[L][i]=0;
  }
}
// ===================== TEST: проверка карты на ошибки (клиент НЕ запускается) =====================
// Кнопка «▶ TEST» прогоняет правила проекта на ТЕКУЩЕЙ карте и показывает результат
// в панели «Проверка карты». Ничего не сохраняет, не собирает и не открывает.
function testMap(){
  const issues = runValidation();                 // validateMap() -> панель (🔴) + предупреждения (🟡)
  const nErr = issues.length, nWarn = validationWarnings().length;
  setStatus(nErr
    ? ('TEST: ошибок ' + nErr + (nWarn ? ', предупреждений ' + nWarn : '') + ' — смотри «Проверка карты»')
    : (nWarn ? ('TEST: ошибок нет, предупреждений ' + nWarn)
             : 'TEST: карта чистая ✓ (ошибок и предупреждений нет)'));
  return issues;
}
// Проверка + сборка одной кнопкой (toolbar «✓»): валидация, и если чисто — сборка .cs
function checkAndBuild(){
  const issues = testMap();                    // validateMap + предупреждения -> панель «Проверка карты»
  if(issues.length){ setStatus('⚠ проверка: ошибок ' + issues.length + ' — сборка отменена'); return issues; }
  buildServerMap();                            // node tools/gen-map.mjs -> server/Map.generated.cs
  return issues;
}
// Сборка серверного кода (отдельно от TEST): node tools/gen-map.mjs -> server/Map.generated.cs
function buildServerMap(){
  setStatus('собираю server/Map.generated.cs из сохранённых data/map_*.json…');
  fetch('/editor/api/gen-map').then(r=>r.json()).then(j=>{
    buildResult = String(j.out||'').trim() || (j.ok ? 'готово' : 'без вывода');
    setStatus(j.ok ? '✔ Map.generated.cs обновлён' : '⚠ сборка вернула ошибку (см. панель)');
    renderValidation();
  }).catch(()=>{
    buildResult = '⚠ сборка недоступна: нужен запущенный serve.mjs (start-editor.cmd)';
    setStatus('сборка недоступна — запусти start-editor.cmd');
    renderValidation();
  });
}
