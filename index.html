  el.innerHTML = (area.atms||[]).map((a,i)=>`<div class="portal-row">
    <input type="number" value="${a[0]}" title="x" onchange="area.atms[${i}][0]=+this.value;draw()">
    <input type="number" value="${a[1]}" title="y" onchange="area.atms[${i}][1]=+this.value;draw()">
    <button title="выбрать на карте" onclick="selectObject('atm',${i})">🎯</button>
    <button class="danger" title="удалить" onclick="pushHistory();area.atms.splice(${i},1);renderAtmList();draw()">✕</button>
  </div>`).join('');
}
function addAtm(){ pushHistory(); area.atms.push([10, H-4]); renderAtmList(); draw(); }
function dupAtm(i){ pushHistory(); const a=(area.atms[i]||[]).slice(); a[0]=Math.min((a[0]|0)+1, W-1); area.atms.splice(i+1,0,a); renderAtmList(); draw(); }


// ===================== 🎲 ГЕНЕРАТОР СЛУЧАЙНОЙ КАРТЫ =====================
// Земля строится ПРОВЕРЕННЫМИ тайлами арены GreenAreaTiles (те же, что в data/map_1.json):
//   36       — трава (верхний, «ходибельный» тайл: по нему игрок стоит),
//   40 / 38  — земля под травой (полные блоки 165x165).
// Дополнительно генератор строит (всё из того же атласа GreenAreaTiles, чтобы рисовалось в игре):
//   40       — стены по краям карты (колонки 0/1 и W-2/W-1 до поверхности; как в GameCode.World.cs),
//   25       — вода в слое mapWater (клиент рисует её анимированной, TileHandler.as:538),
//   70 / 120 — декор магазина в слое mapArt: табличка «STORE →» и прилавок.
// Маркеры (спавн игрока, мобы, НПС, ATM, порталы) ставятся на клетку ПРЯМО НАД землёй —
// ровно так их читает сервер (GameCode.World.cs: GroundYAt(row) = row*165 + 185).
// !!! Ширину менять нельзя (40) — иначе съедут id тайлов атласа.
const GROUND_TOP  = 36;                  // трава (поверхность)
const GROUND_FILL = [40, 38];            // земля под травой (чередуем для фактуры)
const WALL_TILE   = 40;                  // твёрдый блок стены по краям карты
const WATER_TILE  = 25;                  // вода — кладётся в слой mapWater (полный блок с волной)
const SHOP_SIGN   = 70;                  // табличка «STORE →» (слой mapArt)
const SHOP_STALL  = 120;                 // прилавок магазина (слой mapArt)

// ---- какие тайлы РЕАЛЬНО рисуются в игре -------------------------------------------------
// Клиент собирает атлас ЖЁСТКОЙ сеткой 165 px (TileHandler.createTileAtlasXML): основной набор
// (GreenAreaTiles) = 12x11 = 132 ячейки -> id 0..131, передний план (GreenAreaForegroundTiles)
// = 5x8 = 40 ячеек -> id 0..39. Заполнены только тайлы из нарезки (models/tiles/<set>/tiles.json,
// id < cols*rows): «зеркальные» id из манифеста (у основного набора 132..249, у FG 40..71) в
// атлас НЕ попадают. Любой id, которого нет в атласе, даёт getTexture() == null -> Image с
// null-текстурой -> клиент падает (#1009) при первом же портале
// (SortDepths.addAt -> TileHandler.getHighestMainArtIndex -> visualTile_array[i].texture.base).
// Поэтому такие id нельзя ни рисовать, ни сохранять в карту.
const RENDERABLE = {};                   // set -> Set(id); null/undefined = манифест ещё не загружен
function renderableIds(set){
  const cached = RENDERABLE[set];
  if(cached !== undefined) return cached;
  const m = (typeof MANIFESTS !== 'undefined') ? MANIFESTS[set] : null;
  if(!m || !m.tiles || !m.tiles.length || !m.cols || !m.rows) return null;  // манифест не загружен/неполный
  const cap = m.cols * m.rows;
  const s = new Set();
  for(const t of m.tiles) if(t.id < cap) s.add(t.id);
  RENDERABLE[set] = s;
  return s;
}
const setForLayer = (L) => (L === 'fg' ? SEL_FG : SEL_MAIN);
function tileRenderable(L, id){
  if(id === NO) return true;
  const s = renderableIds(setForLayer(L));
  return s ? s.has(id) : true;                         // манифест не загружен — не мешаем работать
}
const GEN_MOBS = ['green bouncer','green walker','purple goo','red bouncer','mushroom squish',
  'mushroom ball','bouncing mushroom','orange crazy','yellow hairy monster','yellow puff monster',
  'horned monster','crab','plant monster','goo cube','brick monster','block bot','night stalker','drill bot'];
let genOpts = { seed:'', style:'mixed', platforms:3, mobs:5, npcs:true, atm:true, portals:true,
  walls:true, water:true, shop:true, bg:'background 1' };
try{ const g = JSON.parse(localStorage.getItem('hh_gen') || 'null'); if(g && typeof g==='object') Object.assign(genOpts, g); }catch(e){}
function saveGenOpts(){ try{ localStorage.setItem('hh_gen', JSON.stringify(genOpts)); }catch(e){} }

// детерминированный ГПСЧ (mulberry32): один сид -> одна и та же карта
function genMulberry32(a){
  a >>>= 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), 1 | t);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function genHash(s){
  let h = 2166136261 >>> 0; s = String(s);
  for(let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
const gRand = (rnd,n) => Math.floor(rnd()*n);
const gPick = (rnd,arr) => arr[gRand(rnd,arr.length)];

function genPut(L,x,y,id){                       // поставить тайл с нулевыми размером/флагом/смещением
  if(x<0 || x>=W || y<0 || y>=H) return;
  const i = y*W + x;
  area.layers[L][i]=id; area.sizes[L][i]=0; area.flag[L][i]=0; area.ox[L][i]=0; area.oy[L][i]=0;
}
const genSolid = (x,y) => (x>=0 && x<W && y>=0 && y<H && area.layers.main[y*W+x] !== NO);

// главная функция: кнопка «🎲 Сгенерировать карту»
async function generateMap(){
  try{ await ensureNpcCatalog(); }catch(e){}     // имена НПС берём из data/npcs.json
  const usedSeedStr = String(genOpts.seed || '').trim();
  const seed = usedSeedStr ? genHash(usedSeedStr) : ((Math.random()*0xFFFFFFFF) >>> 0);
  const rnd  = genMulberry32(seed);
  const style = genOpts.style;

  pushHistoryFull();                             // генерация отменяется через Ctrl+Z (полный снимок)

  // 1) очистка всех слоёв и маркеров
  for(const [k] of LAYERS){
    area.layers[k].fill(NO); area.sizes[k].fill(0); area.flag[k].fill(0);
    area.ox[k].fill(0); area.oy[k].fill(0);
  }
  area.portals = []; area.spawns = []; area.atms = []; area.npcs = []; area.playerSpawn = null;

  // 2) рельеф — верхняя «травяная» клетка каждой колонки
  const baseRow = H - 6;                         // 19 — как пол в map_1
  const surface = new Array(W).fill(baseRow);
  if(style === 'hills' || style === 'mixed'){
    let r = baseRow;
    for(let x=0;x<W;x++){
      if(x > 1 && rnd() < 0.55) r += (gRand(rnd,3) - 1);      // шаг −1/0/+1: мягкие, прыгаемые холмы
      r = Math.max(baseRow-5, Math.min(baseRow+2, r));
      surface[x] = r;
    }
    // края выравниваем — игрок не упирается в стену у самой границы карты
    surface[0]=surface[1]=surface[W-1]=surface[W-2]=baseRow;
  }
  for(let x=0;x<W;x++){
    genPut('main', x, surface[x], GROUND_TOP);                     // трава
    for(let y=surface[x]+1; y<H; y++) genPut('main', x, y, GROUND_FILL[(x+y)%2]);   // земля до низа карты
  }

  // 2б) СТЕНЫ ПО КРАЯМ: колонки 0/1 и W-2/W-1 заливаем твёрдым блоком до самой поверхности —
  //     ровно так делает серверный процедурный генератор (GameCode.World.cs:329). Игрок и мобы
  //     не смогут выйти за карту (иначе падают в пустоту).
  const wallCols = new Set();
  if(genOpts.walls){
    for(const x of [0,1,W-2,W-1]){
      wallCols.add(x);
      for(let y=0; y<surface[x]; y++) genPut('main', x, y, WALL_TILE);
    }
  }

  // 2в) ПРУД: в колонках пруда убираем траву и заливаем это место водой (тайл 25 в слое mapWater),
  //     дно на ряд ниже уже заполнено землёй. В клиенте вода — анимированный слой (TileHandler.as:538).
  const pondCols = new Set();
  if(genOpts.water){
    const ww = 3 + gRand(rnd,3);                            // ширина пруда 3..5 клеток
    const wx = 3 + gRand(rnd, Math.max(1, W - ww - 7));     // не впритык к стенам
    for(let x=wx; x<wx+ww && x<W-3; x++){
      const y = surface[x];                                 // вода — на локальной поверхности колонки
      genPut('main', x, y, NO);                             // убрали траву — ямка
      genPut('water', x, y, WATER_TILE);                    // вода на поверхности
      surface[x] = y + 1;                                   // дно пруда на ряд ниже (земля уже есть)
      pondCols.add(x);
    }
  }

  // 3) парящие платформы (трава + 1 ряд земли под ней) — для вертикали; маркеры туда не ставим
  let plat = genOpts.platforms | 0;
  if(style === 'platforms') plat = Math.max(plat, 4);
  for(let p=0; p<plat; p++){
    const pw = 3 + gRand(rnd,4);                                 // ширина 3..6
    const px = 2 + gRand(rnd, Math.max(1, W - pw - 4));
    const py = 12 + gRand(rnd, Math.max(1, baseRow - 4 - 12));    // ряд 12..(baseRow-5)
    if(py + 1 >= baseRow) continue;
    for(let x=px; x<px+pw && x<W; x++){
      if(pondCols.has(x)) continue;                               // над прудом платформ не ставим
      if(py === surface[x]-1 || py+1 === surface[x]-1) continue;  // не загораживаем клетки под маркеры
      if(genSolid(x,py)) continue;                                // не перекрываем уже занятое
      genPut('main', x, py, GROUND_TOP);
      genPut('main', x, py+1, GROUND_FILL[(x+py)%2]);
    }
  }

  // 4) клетки, где можно поставить маркер: пусто, а ровно под ней земля
  const groundWalk = [];
  for(let x=0;x<W;x++){
    if(wallCols.has(x) || pondCols.has(x)) continue;   // на стенах и в воде маркеров не ставим
    const y = surface[x]-1;
    if(y < 0) continue;
    if(genSolid(x, y)) continue;                       // клетку заняла платформа/блок (холмы) — не годится
    if(!genSolid(x, y+1)) continue;                    // под клеткой обязана быть твёрдая земля
    groundWalk.push([x,y]);
  }
  const taken = new Set();
  const gkey  = (x,y) => y*W + x;
  const nearestTo = (tx) => {                    // ближайшая свободная клетка базовой земли
    let best=null, bd=1e9;
    for(const c of groundWalk){
      if(taken.has(gkey(c[0],c[1]))) continue;
      const d = Math.abs(c[0]-tx);
      if(d < bd){ bd = d; best = c; }
    }
    return best;
  };
  const takeRandom = () => {
    const free = [];
    for(const c of groundWalk) if(!taken.has(gkey(c[0],c[1]))) free.push(c);
    return free.length ? free[gRand(rnd, free.length)] : null;
  };
  const place = (c) => { if(c) taken.add(gkey(c[0],c[1])); return c; };

  // 4б) МАГАЗИН: прилавок и вывеска «STORE →» (декор в слое mapArt) на самом длинном ровном
  //     участке земли, плюс клетка под продавца (её займёт первый НПС-торговец).
  let shopCell = null;
  if(genOpts.shop){
    let bestX = -1, bestLen = 0;                         // ищем подряд идущие колонки одной высоты
    const freeAt = (x) => !wallCols.has(x) && !pondCols.has(x) && !genSolid(x, surface[x]-1);
    for(let x=2; x<=W-3; ){
      if(!freeAt(x)){ x++; continue; }                   // стена/вода/платформа над клеткой — не годится
      let e = x;
      while(e+1 <= W-3 && freeAt(e+1) && surface[e+1]===surface[x]) e++;
      const len = Math.min(e - x + 1, 3);
      if(len > bestLen){ bestLen = len; bestX = x; }
      x = e + 1;
    }
    if(bestX >= 0){
      const r = surface[bestX] - 1;                      // ряд, где стоят игрок/мобы
      if(bestLen >= 3){
        genPut('art', bestX,   r, SHOP_SIGN);            // вывеска «STORE →» слева
        genPut('art', bestX+2, r, SHOP_STALL);           // прилавок справа
        place([bestX, r]); place([bestX+2, r]);          // на декор не встанут мобы/НПС
        shopCell = [bestX+1, r];                         // продавец — между ними
      } else {
        genPut('art', bestX, r, SHOP_STALL);             // места мало — только прилавок
        place([bestX, r]);
        if(bestLen >= 2) shopCell = [bestX+1, r];
      }
      if(shopCell) place(shopCell);                      // клетку продавца резервируем заранее
    }
  }

  // 5) спавн игрока (слева на земле, не на клетке портала)
  const ps = nearestTo(Math.round(W*0.28));
  if(ps) place(ps);
  area.playerSpawn = ps ? [ps[0], ps[1]] : [Math.round(W/2), baseRow-1];

  // 6) мобы — на земле, с коридором патруля ±3 клетки (как в map_1)
  for(let i=0;i<(genOpts.mobs|0);i++){
    const c = takeRandom(); if(!c) break;
    place(c);
    area.spawns.push([c[0], c[1], Math.max(0,c[0]-3), Math.min(W-1,c[0]+3), gPick(rnd, GEN_MOBS)]);
  }

  // 7) НПС-продавцы: 1 на предметы, 1 на питомцев + Ticket Vendor
  if(genOpts.npcs){
    const items = NPC_LIST.filter(n => n.shop && n.shop.type==='items' && n.name!=='Ticket Vendor').map(n=>n.name);
    const pets  = NPC_LIST.filter(n => n.shop && n.shop.type==='pets').map(n=>n.name);
    const names = [ items.length ? gPick(rnd, items) : 'Sales Man',
                    pets.length  ? gPick(rnd, pets)  : 'Tanner' ];
    if(NPC_BY.has('Ticket Vendor')) names.push('Ticket Vendor');
    let shopUsed = false;
    for(const nm of names){
      if(!NPC_BY.get(nm)) continue;              // нет в каталоге — пропускаем (иначе validateMap ругнётся)
      let c;
      if(shopCell && !shopUsed){ c = shopCell; shopUsed = true; }   // первый торговец встаёт у прилавка
      else c = takeRandom();
      if(!c) break;
      place(c);
      area.npcs.push([c[0], c[1], nm, '']);
    }
  }

  // 8) банкомат
  if(genOpts.atm){
    const c = takeRandom();
    if(c){ place(c); area.atms.push([c[0], c[1]]); }
  }

  // 9) порталы по краям карты (ведут в этот же map, номера 1 и 2)
  if(genOpts.portals){
    let n = 1;
    for(const c of [nearestTo(1), nearestTo(W-2)]){
      if(!c) continue;
      place(c);
      area.portals.push([c[0], c[1], n++, '', 0]);
    }
  }

  // 10) ФОН (бекграунд): имя кадра из атласа backgrounds1. Это превью редактора и поле
  //     background в JSON; в самой игре фон выбирает клиент по номеру арены (AreaCreator).
  if(typeof genOpts.bg === 'string') bgName = genOpts.bg;

  if(!usedSeedStr) genOpts.seed = String(seed);   // чтобы «крутить» настройки на той же карте
  saveGenOpts();
  renderMap();                                    // перерисовывает панель, канвас и все списки

  const issues = validateMap();
  setStatus('🎲 сгенерировано (сид ' + genOpts.seed + ', стиль ' + style + '): земля ' +
    groundWalk.length + ' кл., стены ' + wallCols.size + ' кол., вода ' + pondCols.size + ' кл., магазин ' +
    (shopCell ? 'есть' : 'нет') + ', фон ' + (bgName || 'небо') + ', мобов ' + area.spawns.length +
    ', НПС ' + area.npcs.length + ', ATM ' + area.atms.length + ', порталов ' + area.portals.length +
    (issues.length ? ' · ⚠ ' + issues.join('; ') : ' · ✓'));
}

// ---- сериализация / валидация / сохранение ----
function serializeArea(){
  const out = { name:area.name, width:W, height:H,
    layers:{}, sizes:{}, flags:{}, offsets:{},
    portals:area.portals.map(p=>[p[0],p[1],p[2], p[3]||'', p[4]||0]),
    spawns:area.spawns.map(s=>[s[0],s[1],s[2]||0,s[3]||0,s[4]||'']),
    atms:(area.atms||[]).map(a=>[a[0]|0, a[1]|0]),
    npcs:(area.npcs||[]).map(s=>[s[0]|0, s[1]|0, s[2]||'', s[3]||'']),
    // товары/цена НПС берутся из каталога (data/npcs.json), на клетке можно переопределить
    playerSpawn: area.playerSpawn || null,
    background: bgName || '',
    themeMain: SEL_MAIN, themeFg: SEL_FG };
  for(const [k,,jn] of LAYERS){
    out.layers[jn]=area.layers[k]; out.sizes[jn]=area.sizes[k];
    const f={}, o={};
    for(let i=0;i<W*H;i++){
      const fv=area.flag[k][i]||0, ox=area.ox[k][i]||0, oy=area.oy[k][i]||0;
      if(fv) f[i]=fv;
      if(ox||oy) o[i]=[ox,oy];
    }
    out.flags[jn]=f; out.offsets[jn]=o;
  }
  return out;
}
function validateMap(){
  const issues = [];
  if(!area.playerSpawn) issues.push('не задан спавн игрока (инструмент «🚩 Спавн игрока»)');
  // Тайлы вне атласа темы: клиент берёт текстуру по id и на неизвестном получает null ->
  // падает #1009 при входе на карту (SortDepths -> getHighestMainArtIndex). Такие нельзя сохранять.
  for(const [L,,jn] of LAYERS){
    const ok = renderableIds(setForLayer(L));
    if(!ok) continue;                                  // манифест набора ещё не загружен — пропускаем
    let bad = 0, first = '';
    for(let i=0;i<W*H;i++){
      const v = area.layers[L][i];
      if(v === NO || ok.has(v)) continue;
      bad++;
      if(!first) first = 'тайл ' + v + ' (' + (i%W) + ',' + ((i/W)|0) + ')';
    }
    if(bad) issues.push('слой ' + jn + ': ' + bad + ' тайл(ов) вне атласа темы, напр. ' + first +
      ' — в игре они не рисуются и роняют клиент (#1009); замени их тайлами из палитры этого слоя');
  }
  area.portals.forEach((p,i)=>{ const a=String(p[3]||'').trim(); if(a && !/^map_\d+$/.test(a)) issues.push('портал #'+i+': арена «'+a+'» не похожа на map_N'); });
  (area.spawns||[]).forEach((s,i)=>{ const t=String(s[4]||'').trim(); if(t && ENEMIES.indexOf(t)<0) issues.push('спавн #'+i+': моб «'+t+'» нет в списке'); });
  (area.npcs||[]).forEach((n,i)=>{ if(!NPC_BY.get(String(n[2]||''))) issues.push('НПС #'+i+': «'+(n[2]||'')+'» нет в каталоге data/npcs.json'); });
  return issues;
}
function saveMap(){
  const el = document.getElementById('mapName');
  area.name = (el && el.value.trim()) || area.name || 'map_1';
  if(!/^(orig_)?map_\d+$/.test(area.name)) area.name = 'map_1';
  const issues = validateMap();
  if(issues.length && !confirm('Проверка карты нашла проблемы:\n\n• ' + issues.join('\n• ') + '\n\nВсё равно скачать?')) return;
  download(area.name+'.json', JSON.stringify(serializeArea()));
  setStatus('Сохранено: '+area.name+' → положи в data\\'+area.name+'.json');
}
// ---- применение JSON карты (загрузка файла и undo/redo) ----
function applyMapObject(d){
  area.name = d.name || 'map_1';
  // карта может быть любого размера (оригинальные hh-карты 36x13 / 37x13) — размер из файла
  W = Math.max(1, (d.width | 0) || 40);
  H = Math.max(1, (d.height | 0) || 25);
  for(const [k,,jn] of LAYERS){
    // слой берём только если это массив ровно на всю карту; ключ может быть mapMain (наш формат) или main
    const la = d.layers && (d.layers[jn] || d.layers[k]);
    const sz = d.sizes && (d.sizes[jn] || d.sizes[k]);
    area.layers[k] = (Array.isArray(la) && la.length === W*H) ? la.slice() : Array(W*H).fill(NO);
    area.sizes[k]  = (Array.isArray(sz) && sz.length === W*H) ? sz.slice() : Array(W*H).fill(0);
    area.flag[k] = Array(W*H).fill(0);
    area.ox[k] = Array(W*H).fill(0);
    area.oy[k] = Array(W*H).fill(0);
    const f = d.flags && d.flags[jn];
    if(f) for(const key in f){ const i=+key; if(i>=0 && i<W*H) area.flag[k][i] = f[key] | 0; }
    const o = d.offsets && d.offsets[jn];
    if(o) for(const key in o){ const i=+key; if(i>=0 && i<W*H){ area.ox[k][i] = o[key][0]|0; area.oy[k][i] = o[key][1]|0; } }
  }
  area.portals = (d.portals || []).map(p => [p[0]|0, p[1]|0, p[2]|0, p[3]||'', p[4]|0]);
  area.spawns = (d.spawns || []).map(s => [s[0]|0, s[1]|0, s[2]|0, s[3]|0, s[4]||'']);
  area.atms = (d.atms || []).map(a => [a[0]|0, a[1]|0]);
  area.npcs = (d.npcs || []).map(n => [n[0]|0, n[1]|0, String(n[2]||''), n[3]||'']);
  area.playerSpawn = d.playerSpawn || null;
  bgName = d.background || '';
  if(!BG_FRAMES.some(f=>f[0]===bgName)) bgName = '';   // 'sky' и прочие незнакомые имена = просто небо
  if(d.themeMain){ SEL_MAIN = d.themeMain; localStorage.setItem('hh_set_main', SEL_MAIN); }
  if(d.themeFg){ SEL_FG = d.themeFg; localStorage.setItem('hh_set_fg', SEL_FG); }
}
function loadMap(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try{
    applyMapObject(JSON.parse(r.result));
    renderMap(); setStatus('Загружено: '+area.name);
  }catch(e){ setStatus('Ошибка JSON: '+e.message); } };
  r.readAsText(f);
}


function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function download(name,text){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));
  a.download=name; a.click();
}
function setStatus(m){ const el=document.getElementById('status'); if(el) el.textContent=m; }

// ---- undo/redo (Phase 12: ДИФФЕРЕНЦИАЛЬНАЯ история) + автосейв + экспорт PNG ----
// НЕ копируем всю карту на каждое движение: правки тайлов пишутся дельтами клеток
// (index -> [id,size,flag,ox,oy]) + снимок маркеров (их мало). Крупные операции
// (генерация / очистка слоя / вставка зоны) — полный снимок (kind:'full').
let curEdit = null;          // текущая незакрытая правка (дельты клеток)
let pendingFull = null;      // «до»-снимок для крупной операции
function newEdit(){ return { cells:{}, objsBefore:null }; }
function objSnapshot(){
  return { portals: area.portals.map(p => p.slice()), spawns: area.spawns.map(s => s.slice()),
           atms: (area.atms||[]).map(a => a.slice()), npcs: (area.npcs||[]).map(n => n.slice()),
           playerSpawn: area.playerSpawn ? area.playerSpawn.slice() : null };
}
function restoreObjs(s){
  if(!s) return;
  area.portals = s.portals.map(p => p.slice());
  area.spawns  = s.spawns.map(x => x.slice());
  area.atms    = s.atms.map(x => x.slice());
  area.npcs    = s.npcs.map(x => x.slice());
  area.playerSpawn = s.playerSpawn ? s.playerSpawn.slice() : null;
}
function recordCell(L, i){                 // запомнить «до»-значение клетки (один раз на правку)
  if(!curEdit) curEdit = newEdit();
  const m = curEdit.cells[L] || (curEdit.cells[L] = new Map());
  if(!m.has(i)) m.set(i, [area.layers[L][i], area.sizes[L][i], area.flag[L][i], area.ox[L][i], area.oy[L][i]]);
}
function areaSnapshotFull(){
  const s = { W, H, name: area.name, layers:{}, sizes:{}, flag:{}, ox:{}, oy:{},
              objs: objSnapshot(), bg: bgName, themeMain: SEL_MAIN, themeFg: SEL_FG };
  for(const [k] of LAYERS){
    s.layers[k] = area.layers[k].slice(); s.sizes[k] = area.sizes[k].slice();
    s.flag[k] = area.flag[k].slice(); s.ox[k] = area.ox[k].slice(); s.oy[k] = area.oy[k].slice();
  }
  return s;
}
function restoreFull(s){
  W = s.W; H = s.H; area.name = s.name;
  for(const [k] of LAYERS){
    area.layers[k] = s.layers[k].slice(); area.sizes[k] = s.sizes[k].slice();
    area.flag[k] = s.flag[k].slice(); area.ox[k] = s.ox[k].slice(); area.oy[k] = s.oy[k].slice();
  }
  restoreObjs(s.objs); bgName = s.bg; SEL_MAIN = s.themeMain; SEL_FG = s.themeFg;
}
function finalizeEdit(){                   // закрыть текущую правку и положить в историю
  if(pendingFull){
    const before = pendingFull; pendingFull = null;
    history.push({ kind:'full', before, after: areaSnapshotFull() });
    if(history.length > HIST_MAX) history.shift();
    redoStack.length = 0;
    return;
  }
  const e = curEdit; curEdit = null;
  if(!e) return;
  const after = {};
  let hasCells = false;
  for(const L in e.cells){
    const m = e.cells[L]; if(!m.size) continue;
    hasCells = true;
    const a = new Map();
    for(const i of m.keys()) a.set(i, [area.layers[L][i], area.sizes[L][i], area.flag[L][i], area.ox[L][i], area.oy[L][i]]);
    after[L] = a;
  }
  const objsNow = objSnapshot();
  const objsChanged = e.objsBefore && JSON.stringify(e.objsBefore) !== JSON.stringify(objsNow);
  if(!hasCells && !objsChanged) return;              // правок не было — историю не засоряем
  history.push({ kind:'diff', cells:e.cells, after, objsBefore:e.objsBefore, objsAfter:objsNow });
  if(history.length > HIST_MAX) history.shift();
  redoStack.length = 0;
}
function pushHistory(){                    // вызывается ПЕРЕД правкой
  finalizeEdit();
  curEdit = newEdit();
  curEdit.objsBefore = objSnapshot();      // маркеров мало — дёшево
  scheduleAutosave();
}
function pushHistoryFull(){                // крупные операции: генерация / очистка слоя / вставка зоны
  finalizeEdit();
  curEdit = null;
  pendingFull = areaSnapshotFull();
  scheduleAutosave();
}
function applyEntry(entry, dir){
  if(entry.kind === 'full'){ restoreFull(dir === 'before' ? entry.before : entry.after); return; }
  const cells = dir === 'before' ? entry.cells : entry.after;
  for(const L in cells){
    for(const [i, v] of cells[L]){
      area.layers[L][i] = v[0]; area.sizes[L][i] = v[1]; area.flag[L][i] = v[2];
      area.ox[L][i] = v[3]; area.oy[L][i] = v[4];
    }
  }
  restoreObjs(dir === 'before' ? entry.objsBefore : entry.objsAfter);
}
function afterHistoryApply(msg){
  shapeStart = shapeEnd = null; selObjs = []; selObj = null; objBox = null; palDrag = null; pasteMode = null;
  renderMap(); setStatus(msg);
}
function undo(){
  finalizeEdit();
  if(!history.length){ setStatus('нечего отменять'); return; }
  const h = history.pop();
  applyEntry(h, 'before');
  redoStack.push(h);
  if(redoStack.length > HIST_MAX) redoStack.shift();
  afterHistoryApply('отменено');
}
function redo(){
  if(!redoStack.length){ setStatus('нечего повторять'); return; }
  const h = redoStack.pop();
  applyEntry(h, 'after');
  history.push(h);
  if(history.length > HIST_MAX) history.shift();
  afterHistoryApply('повторено');
}
function scheduleAutosave(){
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(()=>{ try{ localStorage.setItem('hh_autosave', JSON.stringify(serializeArea())); }catch(e){} }, 800);
}
function checkAutosave(){
  let raw = null; try{ raw = localStorage.getItem('hh_autosave'); }catch(e){}
  if(!raw) return;
  try{
    const d = JSON.parse(raw);
    if(confirm('Найден автосейв («'+(d.name||'?')+'»). Восстановить его?')){ applyMapObject(d); renderMap(); setStatus('восстановлено из автосейва'); }
  }catch(e){}
}
function exportPng(){
  if(!mapCanvas){ setStatus('нет карты'); return; }
  const cv = renderFullMap();
  const a = document.createElement('a');
  a.href = cv.toDataURL('image/png');
  a.download = (area.name||'map') + '.png'; a.click();
  setStatus('PNG сохранён (вся карта ' + W + '×' + H + '): '+(area.name||'map')+'.png');
}

// --- ресайз боковых панелей (тяни разделитель) ---
(function(){
  const savedL = localStorage.getItem('hh_sidebar_w');
  if(savedL) document.documentElement.style.setProperty('--tools-w', savedL + 'px');
  const savedR = localStorage.getItem('hh_right_w');
  if(savedR) document.documentElement.style.setProperty('--right-w', savedR + 'px');
  let drag = null;
  const start = (id, which) => {
    const sp = document.getElementById(id); if(!sp) return;
    sp.addEventListener('mousedown', (e)=>{
      const target = which === 'L' ? document.getElementById('tools') : document.getElementById('right');
      drag = { which, x:e.clientX, w0: target.getBoundingClientRect().width };
      e.preventDefault();
    });
  };
  start('split', 'L'); start('split2', 'R');
  window.addEventListener('mousemove', (e)=>{
    if(!drag) return;
    if(drag.which === 'L'){
      const w = Math.max(180, Math.min(720, drag.w0 + (e.clientX - drag.x)));
      document.documentElement.style.setProperty('--tools-w', w + 'px');
      localStorage.setItem('hh_sidebar_w', String(Math.round(w)));
    } else {
      const w = Math.max(220, Math.min(640, drag.w0 - (e.clientX - drag.x)));
      document.documentElement.style.setProperty('--right-w', w + 'px');
      localStorage.setItem('hh_right_w', String(Math.round(w)));
    }
  });
  window.addEventListener('mouseup', ()=>{ if(drag){ drag = null; if(currentTab==='map'){ sizeViewport(); draw(); drawMinimap(); } } });
})();

// --- горячие клавиши: R поворот, Shift+R назад, H зеркало ⇄ (по id), G сетка ---
window.addEventListener('keydown', (e)=>{
  if(e.target && /input|select|textarea/i.test(e.target.tagName)) return;
  if(currentTab !== 'map') return;             // на других вкладках горячие клавиши карты не работают
  const k = (e.key||'').toLowerCase();
  if((e.ctrlKey || e.metaKey) && k === 'c'){ if(selObjs.length) copyObjs(); else copySel(); return; }
  if((e.ctrlKey || e.metaKey) && k === 'v'){ pasteSel(); return; }
  if((e.ctrlKey || e.metaKey) && k === 'd'){ if(selObjs.length){ e.preventDefault(); duplicateSelObjs(); } return; }
  if((e.ctrlKey || e.metaKey) && k === 's'){ e.preventDefault(); saveMap(); return; }
  if((e.ctrlKey || e.metaKey) && k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if((e.ctrlKey || e.metaKey) && k === 'y'){ e.preventDefault(); redo(); return; }
  if(e.ctrlKey || e.metaKey || e.altKey) return;   // дальше — одиночные клавиши
  if(k === 'escape'){
    if(pasteMode){ cancelPaste(); return; }
    clearSel(); shapeStart = shapeEnd = null; selObjs = []; selObj = null; objBox = null; renderProps(); draw(); return;
  }
  if(k === 'delete' || k === 'backspace'){ if(selObjs.length){ e.preventDefault(); deleteSelObjs(); } return; }
  if(k.indexOf('arrow') === 0 && selObjs.length){
    e.preventDefault();
    const step = e.shiftKey ? 5 : 1;
    const dx = k === 'arrowleft' ? -step : k === 'arrowright' ? step : 0;
    const dy = k === 'arrowup'   ? -step : k === 'arrowdown'  ? step : 0;
    moveSelObjs(dx, dy); return;
  }
  if(k === 'b') setTool('paint');
  else if(k === 'e') setTool('erase');
  else if(k === 'f') setTool('fill');
  else if(k === 'l') setTool('line');
  else if(k === 'm') setTool('move');
  else if(k === 'p') setTool('pick');
  else if(k === 'h') mirrorBrush();
  else if(k === 'g') toggleGrid();
});

showTab('map');
ensureAssets();
checkAutosave();
</script>

<script>
// ===================== вкладка «Экипировка»: позиции предметов на персонаже и питомце =====================
// Персонаж: оффсеты = массивы BodyAnimator.as (индекс = кадр предмета f - 1), сохранение пишет
//   оба исходника (ffdec-client + tools/build/src) и опционально пересобирает клиент SWF.
// Питомец: оффсеты = gamefs/dynamic_content/misc/pet_body_locations.xml (живой файл GameFS —
//   пересборка не нужна, достаточно перезапустить клиент).
const EQU = {
  data: null, target: 'person',
  slot: 'helmet', personItem: {},           // slot -> имя предмета
  petType: null, petHelmet: 'pet none helmet', petShoe: 'none shoe',
  frame: 0, zoom: 3, lastTs: 0,     // кадр всегда 0 (поза «standing»), анимации нет
  canvas: null, ctx: null, atlasImg: null, atlas: {}, atlasNorm: {},
  drag: null, hits: [], status: '',
  sel: { person: null, pet: null },        // выбранная (обведённая) часть
  showHits: true,                          // показывать хитбоксы всех частей
  dirty: { person: false, pets: false },   // есть несохранённые правки (UI-флаг)
  search: { item: '', helmet: '', shoe: '' },   // фильтры списков предметов
  focusSearch: null,                            // какой поиск вернуть в фокус после перерисовки
  swfMtime: null, statusTimer: 0,               // время сборки gamefs/MyGame.swf
  swf: null,                                    // последний ответ /editor/api/equip-status
  rebuilding: false,                            // идёт ли пересборка SWF прямо сейчас
  // Публикация в hht-client по умолчанию ВЫКЛЮЧЕНА: каждый push = сборка GitHub Pages (~1 мин),
  // и при частых сохранениях сборки копятся/отменяют друг друга. Включается галочкой (localStorage).
  publish: (function(){ try { return localStorage.getItem('equPublish') === '1'; } catch(e){ return false; } })(),
};
const EQU_SLOT_LIST = [
  ['helmet', 'Шлем'], ['shirt', 'Нагрудник (броня)'], ['pants', 'Штаны'], ['shoe', 'Обувь'],
  ['weapon', 'Оружие 1'], ['weapon2', 'Оружие 2'], ['accessory', 'Аксессуар'],
];
// слот -> массивы BodyAnimator (для тяги/записи); левая/правая сторона раздельно
// (правая живёт в armRX/armRY, legRX/legRY — правки 41/42 compile-client)
const EQU_SLOT_ARR = {
  helmet: ['helmetsX', 'helmetsY'], shirt: ['shirtX', 'shirtY'],
  armL: ['armX', 'armY'],           armR: ['armRX', 'armRY'],
  pantsL: ['legX', 'legY'],         pantsR: ['legRX', 'legRY'],
  shoe: ['shoesX', 'shoesY'], weapon: ['weaponsX', 'weaponsY'], weapon2: ['weapons2X', 'weapons2Y'],
  accessory: ['miscX', 'miscY'],
};
// какой слот определяет КАДР для стороны (рукава/штанины наследуют кадр брони/штанов)
const EQU_SLOT_FRAME = { armL: 'shirt', armR: 'shirt', pantsL: 'pants', pantsR: 'pants' };

function ensureEquip(){
  if(EQU.data) return Promise.resolve(EQU.data);
  const p1 = fetch('/editor/api/equip').then(r=>r.json());
  const p2 = fetch('/dynamic_content/sprite_sheets/items_pets_bodies.xml').then(r=>r.text());
  const p3 = new Promise(res=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=()=>res(null); im.src='/dynamic_content/sprite_sheets/items_pets_bodies.png'; });
  return Promise.all([p1, p2, p3]).then(([data, xml, img])=>{
    EQU.data = data; EQU.atlasImg = img;
    const re = /<SubTexture name="([^"]+)"([^>]*)\/>/g; let m;
    while((m = re.exec(xml))){
      const attrs = {}; const ar = /(\w+)="([^"]*)"/g; let a;
      while((a = ar.exec(m[2]))) attrs[a[1]] = +a[2];
      EQU.atlas[m[1]] = { x: attrs.x|0, y: attrs.y|0, w: attrs.width|0, h: attrs.height|0,
        pivotX: attrs.pivotX || 0, pivotY: attrs.pivotY || 0 };
      // 2-й этап: у питомцев ключ в pet_body_locations.xml без пробелов (babybounce), а спрайт
      // в items_pets_bodies.xml с пробелами (baby bounce leg) — держим нормализованный индекс
      const nk = equNorm(m[1]);
      if(!EQU.atlasNorm[nk]) EQU.atlasNorm[nk] = EQU.atlas[m[1]];
    }
    EQU.personItem = { helmet: 'none', shirt: 'red shirt', pants: 'blue jeans', shoe: 'brown shoe',
      weapon: 'none', weapon2: 'none', accessory: 'nothing' };
    EQU.petType = Object.keys(data.pets)[0] || null;
    return data;
  });
}

// подписи частей (обводка/хитбоксы)
const EQU_TITLES = {
  shirt: 'туловище (броня)', armL: 'рукав (левый)', armR: 'рукав (правый)',
  pantsL: 'штанина (левая)', pantsR: 'штанина (правая)', shoe: 'обувь', helmet: 'шлем',
  weapon: 'оружие 1', weapon2: 'оружие 2', accessory: 'аксессуар',
  petHelmet: 'шлем питомца', petShoe: 'обувь питомца',
};

function equSlotFrame(slot){
  const list = (EQU.data.items[slot] || []);
  const it = list.find(i => i.name === EQU.personItem[slot]);
  return it ? it.frame : 1;
}
function equItemByFrame(slot, frame){
  return (EQU.data.items[slot] || []).find(i => i.frame === frame);
}
// нормализация имени спрайта: без пробелов/подчёркиваний, нижний регистр
function equNorm(s){ return String(s == null ? '' : s).replace(/[\s_]+/g, '').toLowerCase(); }
function equTex(name){
  if(name == null) return null;
  // спрайты в items_pets_bodies.xml идут как "<имя>_00" (кадр 0, две цифры), иногда "_0"
  if(EQU.atlas[name]) return EQU.atlas[name];
  if(EQU.atlas[name + '_00']) return EQU.atlas[name + '_00'];
  if(EQU.atlas[name + '_0']) return EQU.atlas[name + '_0'];
  // 2-й этап: части питомца собираются как T+' leg'/' body'/' head' (babybounce leg), а спрайты
  // в атласе — с пробелами (baby bounce leg) -> ищем по нормализованному имени
  return EQU.atlasNorm[equNorm(name)] || null;
}
function equDraw(ctx, name, x, y, mirror, pivotless){
  const t = equTex(name); if(!t || !EQU.atlasImg) return;
  const px = pivotless ? 0 : t.pivotX, py = pivotless ? 0 : t.pivotY;
  ctx.save();
  if(mirror){ ctx.scale(-1, 1); x = -x; }
  ctx.drawImage(EQU.atlasImg, t.x, t.y, t.w, t.h, x - px, y - py, t.w, t.h);
  ctx.restore();
}
function equHit(slot, x, y, t){
  if(!t) return;
  EQU.hits.push({ slot, x: x - t.w / 2, y: y - t.h / 2, w: t.w, h: t.h });
}

// ---- рисование персонажа (геометрия BodyAnimator: addChild-порядок + конструктор) ----
function equDrawPerson(ctx, f){
  const D = EQU.data.person, M = D.matrices, O = D.offsets;
  const at = (arr, i) => arr[i] || 0;
  const Mx = (arr) => arr[f] || { a: 1, b: 0, c: 0, d: 1, tx: 0, ty: 0 };
  const part = (m, fn) => { ctx.save(); ctx.transform(m.a, m.b, m.c, m.d, m.tx, m.ty); fn(); ctx.restore(); };
  const hF = equSlotFrame('helmet'), sF = equSlotFrame('shirt'), pF = equSlotFrame('pants'),
        shF = equSlotFrame('shoe'), wF = equSlotFrame('weapon'), w2F = equSlotFrame('weapon2'),
        aF = equSlotFrame('accessory');
  // 1) аксессуар
  part(Mx(M.acc), ()=>{
    if(aF > 1){
      const x = at(O.miscX, aF-1), y = at(O.miscY, aF-1);
      equDraw(ctx, EQU.personItem.accessory, x, y, false); equHit('accessory', x, y, equTex(EQU.personItem.accessory));
    }
  });
  // 2) оружие 2 (правая рука) + правая кисть — СВОЯ пара weapons2X/Y (правка 43)
  part(Mx(M.weapon2), ()=>{
    equDraw(ctx, 'bare hand 1', 0, 38, false, true);
    if(w2F > 1){
      const x = at(O.weapons2X, w2F-1), y = at(O.weapons2Y, w2F-1);
      equDraw(ctx, EQU.personItem.weapon2, x, y, false); equHit('weapon2', x, y, equTex(EQU.personItem.weapon2));
    }
  });
  // 3-5) руки брони и штанины — ЛЕВАЯ и ПРАВАЯ сторона раздельно (armX/armY vs armRX/armRY,
  //      legX/legY vs legRX/legRY), пивот атласа как в клиенте (BodyAnimator:1428-1436, 1496-1505)
  part(Mx(M.rightArm), ()=>{
    if(sF > 1){
      const x = at(O.armRX, sF-1), y = at(O.armRY, sF-1);
      equDraw(ctx, EQU.personItem.shirt + ' arm', x, y, false); equHit('armR', x, y, equTex(EQU.personItem.shirt + ' arm'));
    }
  });
  part(Mx(M.rightLeg), ()=>{
    if(shF > 1){
      const x = at(O.shoesX, shF-1), y = at(O.shoesY, shF-1);
      equDraw(ctx, EQU.personItem.shoe, x, y, false); equHit('shoe', x, y, equTex(EQU.personItem.shoe));
    }
    if(pF > 1){
      const x = at(O.legRX, pF-1), y = at(O.legRY, pF-1);
      // без зеркала: клиент рисует обе ноги одним текстуром без scaleX=-1
      equDraw(ctx, EQU.personItem.pants, x, y, false); equHit('pantsR', x, y, equTex(EQU.personItem.pants));
    } else equDraw(ctx, EQU.personItem.pants, -3, -13, false, true);
  });
  part(Mx(M.leftLeg), ()=>{
    if(shF > 1) equDraw(ctx, EQU.personItem.shoe, at(O.shoesX, shF-1), at(O.shoesY, shF-1), false);
    if(pF > 1){
      const x = at(O.legX, pF-1), y = at(O.legY, pF-1);
      equDraw(ctx, EQU.personItem.pants, x, y, false); equHit('pantsL', x, y, equTex(EQU.personItem.pants));
    } else equDraw(ctx, EQU.personItem.pants, -3, -13, false, true);
  });
  // 6) нагрудник
  part(Mx(M.body), ()=>{
    const x = at(O.shirtX, sF-1), y = at(O.shirtY, sF-1);
    equDraw(ctx, EQU.personItem.shirt, x, y, false); equHit('shirt', x, y, equTex(EQU.personItem.shirt));
  });
  // 7) голова: голова -> шлем (под волосами, addChildAt numChildren-1) -> глаза/волосы
  part(Mx(M.head), ()=>{
    equDraw(ctx, 'male head 1', -14, -13, false, true);
    if(hF > 1){
      const x = at(O.helmetsX, hF-1), y = at(O.helmetsY, hF-1);
      equDraw(ctx, EQU.personItem.helmet, x, y, false); equHit('helmet', x, y, equTex(EQU.personItem.helmet));
    }
    equDraw(ctx, 'eyes 1', -3, -5, false, true);
    equDraw(ctx, 'hair 1', -34, -45, false, true);
  });
  // 9) левая рука брони — armX/armY с пивотом (правая — armRX/armRY выше)
  part(Mx(M.leftArm), ()=>{
    if(sF > 1){
      const x = at(O.armX, sF-1), y = at(O.armY, sF-1);
      equDraw(ctx, EQU.personItem.shirt + ' arm', x, y, false); equHit('armL', x, y, equTex(EQU.personItem.shirt + ' arm'));
    }
  });
  // 10) оружие 1 + левая кисть
  part(Mx(M.weapon1), ()=>{
    if(wF > 1){
      const x = at(O.weaponsX, wF-1), y = at(O.weaponsY, wF-1);
      equDraw(ctx, EQU.personItem.weapon, x, y, false); equHit('weapon', x, y, equTex(EQU.personItem.weapon));
    }
    equDraw(ctx, 'bare hand 1', 0, 38, false, true);
  });
}

// ---- рисование питомца (формулы Pet.as updateFrame) ----
function equDrawPet(ctx, f){
  const P = EQU.data.pets[EQU.petType]; if(!P) return;
  const T = EQU.petType;
  const at = (arr, i) => (arr && arr[i] != null) ? arr[i] : 0;
  const hx = at(P.headX, f), hy = at(P.headY, f);
  const leg = (lx, ly, lr, shoeMirror) => {
    ctx.save(); ctx.translate(lx, ly); ctx.rotate(lr * Math.PI / 180);
    const sF = equSlotFrame('shoe');    // обувь питомца = кадр из shoeStats
    if(sF > 1){
      const x = (P.shoePlaceX|0) + 7, y = (P.shoePlaceY|0) - 3;
      equDraw(ctx, EQU.petShoe, x, y, shoeMirror); equHit('petShoe', x, y, equTex(EQU.petShoe));
    }
    // пивот из атласа обязателен: Pet.as:749-752 ставит pivot у leg/head/body,
    // без него части съезжают (туловище ниже ног)
    equDraw(ctx, T + ' leg', 0, 0, false);
    ctx.restore();
  };
  leg(at(P.rightLegX, f), at(P.rightLegY, f), at(P.rightLegRotation, f), true);
  if((P.bodyX || []).length > 1){
    ctx.save();
    ctx.translate(at(P.bodyX, f), at(P.bodyY, f));
    ctx.scale(at(P.bodyScaleX, f) || 1, at(P.bodyScaleY, f) || 1);
    equDraw(ctx, T + ' body', 0, 0, false);
    ctx.restore();
  } else equDraw(ctx, T + ' body', 0, 0, false);
  leg(at(P.leftLegX, f), at(P.leftLegY, f), at(P.leftLegRotation, f), false);
  equDraw(ctx, T + ' head', hx, hy, false);
  const hF = equSlotFrame('petHelmet');
  const ho = EQU.data.petHelmetOffsets || { x: [], y: [] };
  const fx = ho.x[hF-1] || 0, fy = ho.y[hF-1] || 0;
  const hlx = hx + (P.helmetOffsetX|0) + fx + 2, hly = hy + (P.helmetOffsetY|0) + fy - 2;
  ctx.save(); ctx.translate(hlx, hly); ctx.scale(P.helmetScale || 1, P.helmetScale || 1); ctx.translate(-hlx, -hly);
  equDraw(ctx, EQU.petHelmet, hlx, hly, false);
  ctx.restore();
  equHit('petHelmet', hlx, hly, equTex(EQU.petHelmet));
}

function equDrawFrame(){
  const cv = EQU.canvas, ctx = EQU.ctx; if(!cv) return;
  const W = cv.width, H = cv.height, z = EQU.zoom;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#20242c'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#2c313c'; ctx.beginPath();
  ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H); ctx.moveTo(0, H*0.78); ctx.lineTo(W, H*0.78);
  ctx.stroke();
  EQU.hits = [];
  ctx.setTransform(z, 0, 0, z, W/2, H*0.62);
  ctx.imageSmoothingEnabled = false;
  if(EQU.target === 'person') equDrawPerson(ctx, EQU.frame % (EQU.data.person.matrices.head.length || 1));
  else equDrawPet(ctx, EQU.frame % (((EQU.data.pets[EQU.petType]||{}).headX || [0]).length || 1));
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  // обводки: выбранная часть — яркий пунктир, остальные — условные хитбоксы (как в редакторах)
  const selSlot = EQU.sel[EQU.target];
  ctx.font = '10px sans-serif';
  for(const h of EQU.hits){
    const isSel = h.slot === selSlot;
    if(!isSel && !EQU.showHits) continue;
    const x = W/2 + z*h.x, y = H*0.62 + z*h.y, w = z*h.w, hh = z*h.h;
    ctx.strokeStyle = isSel ? '#ff9d2e' : 'rgba(120,200,255,0.30)';
    ctx.lineWidth = isSel ? 2 : 1;
    if(isSel) ctx.setLineDash([5, 3]);
    ctx.strokeRect(x, y, w, hh);
    ctx.setLineDash([]);
    ctx.fillStyle = isSel ? '#ff9d2e' : 'rgba(150,210,255,0.55)';
    ctx.fillText((EQU_TITLES[h.slot] || h.slot) + (isSel ? ' — тащите мышью / стрелками' : ''), x, Math.max(10, y - 4));
  }
}

  'publish-verify': 'проверка облачного SWF', 'publish-push': 'git commit + push',
};

// статус-бар: валидность gamefs/MyGame.swf + полоса прогресса пересборки
function equRenderStatus(j){
  EQU.swf = j;
  EQU.rebuilding = !!j.rebuilding;
  const st = document.getElementById('equSwfStatus');
  const pct = document.getElementById('equSwfPct');
  const bar = document.getElementById('equProgress');
  const note = document.getElementById('equSwfNote');
  if(!st || !bar) return;
  const t = j.swfMtime ? new Date(j.swfMtime).toLocaleString() : 'нет файла';
  st.textContent = 'SWF: ' + (j.swfSize ? (j.swfSize/1048576).toFixed(1) + ' МБ · ' : '') + t + ' · ' + (j.swfOk ? '✅' : '❌');
  st.title = (j.swfCheck || '') + (j.logTail ? '\n\nлог tools/rebuild-client.log (хвост):\n' + j.logTail : '');
  const p = Math.max(0, Math.min(100, j.percent | 0));
  bar.style.width = p + '%';
  bar.className = 'swfbar-fill' + (j.error ? ' err' : (!j.rebuilding && j.swfOk ? ' ok' : ''));
  pct.textContent = p + '%';
  pct.style.color = j.error ? 'var(--danger2)' : (j.rebuilding ? 'var(--acc)' : 'var(--acc2)');
  let msg;
  const ph = j.phase === 'publish' ? 'Публикация в hht-client' : 'Пересборка';
  if(j.rebuilding) msg = ph + ': шаг ' + (j.step||'?') + '/' + (j.totalSteps||'?') + ' — ' + (EQU_STEP_RU[j.stepName] || j.stepName || '…');
  else if(j.error) msg = '❌ Ошибка сборки: ' + j.error + ' — подробности в логе (наведите на строку статуса).';
  else if(j.done) msg = (j.phase === 'publish')
    ? '✅ Сборка и публикация завершены — игроки получат обновление за 1–2 мин; для локальной проверки перезапустите клиент (deploy\\stop.cmd → start.cmd).'
    : '✅ Сборка завершена — перезапустите клиент (deploy\\stop.cmd → start.cmd); при застарелом кэше — start.ps1 -ClearCache.';
  else if(j.swfOk) msg = 'SWF валиден (' + (j.swfCheck||'') + ').';
  else msg = '⚠️ ' + (j.swfCheck || 'SWF не проверен') + ' — нажмите «Сохранить и пересобрать SWF».';
  note.textContent = msg;
}

// лёгкий статус: время сборки SWF + прогресс пересборки (во время сборки опрос чаще — раз в 1.5 с)
function equPollStatus(){
  if(EQU.statusTimer) clearTimeout(EQU.statusTimer);   // один цикл опроса, а не по одному на каждый рендер
  fetch('/editor/api/equip-status').then(r=>r.json()).then(j=>{
    equRenderStatus(j);
    EQU.statusTimer = setTimeout(()=>{ if(currentTab === 'equip') equPollStatus(); }, j.rebuilding ? 1500 : 5000);
  }).catch(()=>{
    EQU.statusTimer = setTimeout(()=>{ if(currentTab === 'equip') equPollStatus(); }, 5000);
  });
}

// выбор части кнопкой: слот -> родительский предмет для дропдауна + перерисовка обводки
function equPick(slot){
  EQU.sel[EQU.target] = slot;
  if(EQU.target === 'person'){
    const fs = EQU_SLOT_FRAME[slot] || slot;
    if(EQU_SLOT_LIST.some(l => l[0] === fs)) EQU.slot = fs;
  }
  buildEquipPanel();
}

function buildEquipStage(){
  const stage = document.getElementById('stage');
  stage.innerHTML = '<canvas id="equCanvas" width="900" height="620" class="nogrid" style="width:100%;height:100%"></canvas>';
  EQU.canvas = document.getElementById('equCanvas');
  EQU.ctx = EQU.canvas.getContext('2d');
  const coords = (e)=>{
    const r = EQU.canvas.getBoundingClientRect();
    const z = EQU.zoom * (EQU.canvas.width / r.width);
    const cx = EQU.canvas.width/2, cy = EQU.canvas.height*0.62;
    return { wx: ((e.clientX - r.left) * (EQU.canvas.width / r.width) - cx) / z,
             wy: ((e.clientY - r.top) * (EQU.canvas.height / r.height) - cy) / z };
  };
  EQU.canvas.onmousedown = (e)=>{
    const { wx, wy } = coords(e);
    let best = null;
    for(const h of EQU.hits)
      if(wx >= h.x && wx <= h.x + h.w && wy >= h.y && wy <= h.y + h.h) best = h;
    if(best){
      EQU.drag = { slot: best.slot, lastX: wx, lastY: wy };
      EQU.sel[EQU.target] = best.slot;                 // клик = выбрать часть (обводка)
      if(EQU.target === 'person'){
        // дропдаун предмета показывает родительский слот (штанина -> штаны, рукав -> броня)
        const fs = EQU_SLOT_FRAME[best.slot] || best.slot;
        if(EQU.slot !== fs && EQU_SLOT_LIST.some(l => l[0] === fs)){ EQU.slot = fs; buildEquipPanel(); }
      }
    }
  };
  EQU.canvas.onmousemove = (e)=>{
    if(!EQU.drag) return;
    const { wx, wy } = coords(e);
    const dx = wx - EQU.drag.lastX, dy = wy - EQU.drag.lastY;
    EQU.drag.lastX = wx; EQU.drag.lastY = wy;
    equNudge(EQU.drag.slot, dx, dy);
  };
  window.addEventListener('mouseup', ()=>{ EQU.drag = null; });
}

// сдвиг предмета слота: питомец — скаляры XML; персонаж — ячейки массивов по кадру предмета
function equNudge(slot, dx, dy){
  const rdx = Math.round(dx), rdy = Math.round(dy);
  if(!rdx && !rdy) return;
  if(EQU.target === 'pet'){
    const P = EQU.data.pets[EQU.petType]; if(!P) return;
    if(slot === 'petHelmet'){ if(/none/.test(EQU.petHelmet)) return; P.helmetOffsetX = (P.helmetOffsetX|0) + rdx; P.helmetOffsetY = (P.helmetOffsetY|0) + rdy; EQU.dirty.pets = true; }
    else if(slot === 'petShoe'){ if(/none/.test(EQU.petShoe)) return; P.shoePlaceX = (P.shoePlaceX|0) + rdx; P.shoePlaceY = (P.shoePlaceY|0) + rdy; EQU.dirty.pets = true; }
  } else {
    const arr = EQU_SLOT_ARR[slot]; if(!arr) return;
    const frameSlot = EQU_SLOT_FRAME[slot] || slot;   // рукава/штанины наследуют кадр брони/штанов
    // «пустые» предметы не двигаем (none/nothing, оружие-кадр 4); blue jeans с f=1 — валидна:
    // индекс 0 массива это настоящая позиция
    const nm = EQU.personItem[frameSlot];
    if(!nm || nm === 'none' || nm === 'nothing') return;
    const frame = equSlotFrame(frameSlot);
    const O = EQU.data.person.offsets;
    if(O[arr[0]][frame-1] == null) return;
    // каждая часть двигается независимо: туловище (shirtX/Y), рукав L/R (armX/Y vs armRX/RY),
    // штанина L/R (legX/Y vs legRX/RY) — правая сторона живёт в отдельных массивах (правки 41/42)
    O[arr[0]][frame-1] += rdx; O[arr[1]][frame-1] += rdy;
    EQU.dirty.person = true;
  }
  equDrawFrame();
}

// стрелки: двигают ВЫБРАННУЮ часть (клик по ней на канвасе)
window.addEventListener('keydown', (e)=>{
  if(currentTab !== 'equip' || !EQU.canvas) return;
  if(e.target && /input|select|textarea/i.test(e.target.tagName)) return;
  const step = e.shiftKey ? 5 : 1;
  const slot = EQU.sel[EQU.target];
  const map = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
  if(map[e.key] && slot){ e.preventDefault(); equNudge(slot, map[e.key][0], map[e.key][1]); }
});

function equSave(rebuild, publish){
  const body = {};
  const isPerson = EQU.target === 'person';
  if(isPerson) body.person = EQU.data.person.offsets;
  else body.pets = { [EQU.petType]: {
    helmetOffsetX: EQU.data.pets[EQU.petType].helmetOffsetX|0, helmetOffsetY: EQU.data.pets[EQU.petType].helmetOffsetY|0,
    helmetScale: EQU.data.pets[EQU.petType].helmetScale, shoePlaceX: EQU.data.pets[EQU.petType].shoePlaceX|0,
    shoePlaceY: EQU.data.pets[EQU.petType].shoePlaceY|0 } };
  // Персонаж: правки живут в BodyAnimator.as и попадают в игру ТОЛЬКО после пересборки SWF,
  // поэтому «Сохранить» для персонажа всегда запускает пересборку. Питомец — живой XML, сборка не нужна.
  body.rebuild = isPerson ? true : !!rebuild;
  // публикация в hht-client (репо, откуда играют): на сервере идёт ПОСЛЕ пересборки, одним процессом
  body.publish = (publish === undefined) ? !!EQU.publish : !!publish;
  EQU.rebuilding = body.rebuild || body.publish;
  EQU.status = body.rebuild ? 'сохранено — пересобираю SWF…'
             : (body.publish ? 'сохранено — публикую в hht-client…' : 'сохранение…');
  buildEquipPanel();
  fetch('/editor/api/equip', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
    .then(r => r.json()).then(j => {
      if(j.ok){
        EQU.dirty.person = false; EQU.dirty.pets = false;
        EQU.rebuilding = !!(j.busy || j.rebuilding || j.publishing);
        if(j.busy) EQU.status = 'сохранено, но сборка/публикация уже идёт — дождитесь её конца и нажмите «Сохранить» ещё раз';
        else EQU.status = (j.rebuilding || j.publishing)
          ? 'сохранено; идёт ' + (j.publishing ? (j.rebuilding ? 'пересборка + публикация в hht-client' : 'публикация в hht-client') : 'пересборка SWF') + ' — смотрите полосу прогресса ниже'
          : 'сохранено в gamefs/pet_body_locations.xml — перезапустите клиент, чтобы увидеть';
      } else { EQU.rebuilding = false; EQU.status = 'ошибка'; }
      buildEquipPanel();
    }).catch(e => { EQU.rebuilding = false; EQU.status = 'ошибка: ' + e.message; buildEquipPanel(); });
}
